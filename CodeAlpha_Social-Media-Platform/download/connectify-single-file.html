<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connectify — Social (Single File)</title>
<!--
  ============================================================================
  CONNECTIFY — FULL-STACK SOCIAL MEDIA PLATFORM IN ONE FILE
  CodeAlpha Full Stack Development Internship — single-file edition

  This is the COMPLETE platform (all 13 feature areas) packed into one
  self-contained HTML file that runs in any modern browser with zero install.

  Architecture mapping (vs. the MERN original in social-media-platform.zip):
    • React SPA            ->  vanilla-JS SPA with hash router (same routes)
    • Express controllers  ->  in-browser API layer with the SAME REST
                               routes, status codes (400/401/403/404/409),
                               validation and ownership authorization
    • MongoDB collections  ->  localStorage collections (users, posts,
                               comments, likes, follows, notifications)
                               with the same compound-unique relationship
                               rules (like{user,post}, follow{follower,following})
    • jsonwebtoken (HS256) ->  REAL JWTs signed with HMAC-SHA256 via WebCrypto
                               (header.payload.signature, exp checked on every call)
    • bcrypt hashing       ->  SHA-256 password hashes with per-user random salt
                               via WebCrypto (browser crypto.subtle cannot do bcrypt)
    • multer uploads       ->  FileReader + canvas resize -> dataURL stored with the post

  Everything persists across refreshes. Seed data loads on first run
  (6 users / 12 posts / likes / comments / follows / notifications).
  Demo login: alex@demo.com  /  Password123
  ============================================================================
-->
<style>
/* ============ DESIGN SYSTEM ============ */
:root{
  --primary:#7c3aed; --primary-strong:#6d28d9; --primary-soft:#f3ecfe;
  --bg:#f7f6fb; --surface:#ffffff; --border:#e8e6f0; --border-strong:#d9d5e8;
  --text:#1c1a27; --text-2:#5f5b72; --text-3:#8f8ba3;
  --like:#e0245e; --ok:#16a34a; --err:#dc2626; --warn:#d97706;
  --shadow:0 1px 2px rgba(28,26,39,.05),0 4px 16px rgba(28,26,39,.06);
  --shadow-lg:0 8px 40px rgba(28,26,39,.18);
  --r:14px; --r-sm:9px;
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.55;
  min-height:100vh; min-height:100dvh;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
img{display:block;max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============ APP SHELL ============ */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.shell main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:20px 16px 90px}
@media(min-width:721px){.shell main{padding:24px 16px 48px}}

/* ============ NAVBAR (desktop) ============ */
.navbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.navbar-inner{max-width:900px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;gap:14px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--text);letter-spacing:-.3px}
.brand:hover{text-decoration:none}
.brand-logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.nav-search{flex:1;max-width:320px}
.nav-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.nav-link{width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);position:relative;transition:background .15s,color .15s}
.nav-link:hover{background:var(--primary-soft);color:var(--primary)}
.nav-link.active{color:var(--primary);background:var(--primary-soft)}
.nav-badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--like);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.nav-avatar-btn{border-radius:50%;padding:2px;border:2px solid transparent}
.nav-avatar-btn:hover{border-color:var(--primary-soft)}
.menu-anchor{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);min-width:220px;padding:6px;z-index:50;animation:pop .14s ease}
.menu-header{padding:10px 12px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu-header .name{font-weight:700}
.menu-header .username{color:var(--text-3);font-size:13px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--r-sm);color:var(--text);font-size:14px}
.menu-item:hover{background:var(--bg);text-decoration:none}
.menu-item.danger{color:var(--err)}
.menu-divider{height:1px;background:var(--border);margin:6px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

/* ============ BOTTOM NAV (mobile) ============ */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav-inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;margin:0 auto}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;color:var(--text-3);font-size:11px;font-weight:600;border-radius:10px;position:relative}
.bottom-nav a.active{color:var(--primary)}
.bottom-nav .nav-badge{top:0;right:calc(50% - 22px)}
@media(max-width:720px){
  .bottom-nav{display:block}
  .navbar .nav-search{display:none}
  .nav-links-desktop{display:none!important}
}

/* ============ CARDS / LAYOUT ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.page-heading{font-size:21px;font-weight:800;letter-spacing:-.3px;margin-bottom:16px}
.page-fade{animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ FORMS ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);display:inline-flex}
.input{width:100%;padding:11px 12px;border:1.5px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input-wrap .input{padding-left:38px}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r-sm);font-weight:700;font-size:14px;transition:filter .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){box-shadow:0 6px 20px rgba(124,58,237,.4);filter:brightness(1.05)}
.btn-outline{border:1.5px solid var(--border-strong);color:var(--text);background:var(--surface)}
.btn-outline:hover:not(:disabled){border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-soft:hover:not(:disabled){background:#ebe2fd}
.btn-danger{background:var(--err);color:#fff}
.btn-lg{padding:12px 18px;font-size:15px}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-block{width:100%}
.btn-icon{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .15s,color .15s}
.btn-icon:hover{background:var(--primary-soft);color:var(--primary)}

/* ============ ALERTS / TOASTS ============ */

.alert.success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}

#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px)}
.toast{background:#241f33;color:#fff;padding:11px 16px;border-radius:11px;font-size:14px;box-shadow:var(--shadow-lg);animation:fadeUp .2s ease;display:flex;gap:8px;align-items:center}

/* ============ AUTH PAGES ============ */
.auth-shell{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}

.auth-hero::after{content:"";position:absolute;width:480px;height:480px;border-radius:50%;background:rgba(255,255,255,.07);right:-160px;bottom:-160px}
.auth-hero h1{font-size:32px;line-height:1.2;letter-spacing:-.5px;margin-bottom:14px}
.auth-hero p{color:rgba(255,255,255,.85);max-width:44ch}

.auth-points li{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.92);font-size:14.5px}
.pt-icon{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;flex:none}
.auth-form-side{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.auth-card{width:100%;max-width:400px}
.auth-card h2{font-size:24px;letter-spacing:-.4px;margin-bottom:4px}
.auth-card .sub{color:var(--text-2);margin-bottom:20px}

  .auth-shell{grid-template-columns:1fr}

/* ============ COMPOSER ============ */

.composer-row{display:flex;gap:11px}
.composer-main{flex:1}
.composer-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.composer-tools{display:flex;align-items:center;gap:4px}
.char-count{font-size:12.5px;color:var(--text-3)}
.char-count.over{color:var(--err);font-weight:700}
.image-preview{position:relative;margin-top:10px}
.image-preview img{max-height:320px;width:100%;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--border)}
.image-preview .remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center}
.flex-center{display:flex;align-items:center}

/* ============ POST CARD ============ */
.post{padding:14px 16px;margin-bottom:14px}
.post-head{display:flex;align-items:center;gap:10px}
.post-head .who{flex:1;min-width:0}
.post-head .nm{font-weight:700;color:var(--text);font-size:14.5px}
.post-head .nm:hover{color:var(--primary);text-decoration:none}
.post-head .un,.post-head .tm{color:var(--text-3);font-size:13px}
.post-body{margin:10px 0 4px;white-space:pre-wrap;word-wrap:break-word}
.post-img{margin-top:10px;border-radius:var(--r-sm);border:1px solid var(--border);max-height:420px;width:100%;object-fit:cover;cursor:zoom-in}

.stat-btn.liked{color:var(--like)}

.stat-btn.on{color:var(--primary)}
.edit-area{margin-top:8px}
.edit-area .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.post-menu-wrap{position:relative}
.post-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow-lg);min-width:150px;padding:5px;z-index:20;animation:pop .13s ease}
.post-menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 11px;border-radius:8px;font-size:13.5px;color:var(--text)}
.post-menu button:hover{background:var(--bg)}
.post-menu button.danger{color:var(--err)}

/* ============ COMMENTS ============ */

.comment{display:flex;gap:9px;padding:8px 0}
.comment .body{flex:1;min-width:0;background:var(--bg);border-radius:11px;padding:8px 12px}
.comment .meta{font-size:12.5px;color:var(--text-3)}
.comment .meta b{color:var(--text);font-size:13px}
.comment .txt{font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.comment .del{color:var(--text-3);align-self:flex-start;padding:6px}

.comment-form{display:flex;gap:8px;margin-top:10px}

/* ============ PROFILE ============ */
.profile-head{padding:20px;text-align:center}
.profile-head .cover{height:92px;margin:-20px -20px 0;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(120deg,#8b5cf6,#d946ef 60%,#f59e0b)}

.counters{display:flex;justify-content:center;gap:26px;margin-top:14px}

.user-row .nm{font-weight:700;font-size:14.5px;color:var(--text)}
.user-row .nm:hover{color:var(--primary);text-decoration:none}
.user-row .un{color:var(--text-3);font-size:13px}
.user-row .bio-snip{color:var(--text-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ SEARCH ============ */
.search-hero{padding:22px 16px;text-align:center}
.search-hero h3{font-size:18px;margin-bottom:4px}
.search-hero p{color:var(--text-3);font-size:13.5px}
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-bar .input-wrap{flex:1}

/* ============ NOTIFICATIONS ============ */
.notif-item{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--bg)}

/* ============ AVATAR ============ */
.avatar{border-radius:50%;object-fit:cover;flex:none;background:var(--border)}
.av-sm{width:30px;height:30px}
.av-md{width:40px;height:40px}

/* ============ SPINNER / SKELETON / EMPTY ============ */
.spinner{width:18px;height:18px;border:2.5px solid rgba(127,127,127,.25);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;flex:none}
.spinner.light{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-wrap{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text-3);padding:36px 0}
.skeleton{background:linear-gradient(90deg,#eceaf3 25%,#f6f5fa 50%,#eceaf3 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}
.sk-post{padding:16px;display:flex;gap:11px;margin-bottom:14px}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:9px}
.sk-lines .s1{height:13px;width:34%}
.sk-lines .s2{height:12px;width:88%}

.empty b{display:block;color:var(--text);font-size:15.5px;margin-bottom:4px}

.modal-overlay{position:fixed;inset:0;background:rgba(20,16,32,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s ease}

<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ==================================================================
   PART 1 — CORE: utils, icons, crypto (SHA-256 + real HS256 JWT),
   localStorage database, seed data, REST-style API layer
   ================================================================== */

/* ---------- tiny DOM / format utils ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const timeAgo = ts => {
  const s = Math.max(1, (Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  const m = s / 60;  if (m < 60)  return Math.floor(m) + 'm ago';
  const h = m / 60;  if (h < 24)  return Math.floor(h) + 'h ago';
  const d = h / 24;  if (d < 7)   return Math.floor(d) + 'd ago';
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
};
const initials = name => name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
function hashCode(str){ let h = 0; for (let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; } return Math.abs(h); }

function avatarURI(name, hue){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'>` +
    `<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>` +
    `<stop offset='0' stop-color='hsl(${hue},72%,58%)'/><stop offset='1' stop-color='hsl(${(hue+45)%360},70%,42%)'/>` +
    `</linearGradient></defs><rect width='96' height='96' fill='url(#g)'/>` +
    `<text x='48' y='60' font-family='system-ui,-apple-system,sans-serif' font-size='36' font-weight='700' fill='#fff' text-anchor='middle'>${initials(name)}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function seedImageURI(hue, variant){
  const shapes = variant % 3 === 0
    ? `<circle cx='620' cy='180' r='150' fill='rgba(255,255,255,.16)'/><circle cx='700' cy='420' r='90' fill='rgba(255,255,255,.12)'/>`

/* ==================================================================
   CRYPTO — SHA-256 password hashing + REAL HS256 JWT (WebCrypto)
   ================================================================== */
const enc = new TextEncoder();
const b64url = buf => {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s = ''; bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPassword(password, salt){ return sha256Hex(`${salt}::${password}`); }
async function makeSalt(){ const b = crypto.getRandomValues(new Uint8Array(12)); return b64url(b); }

const JWT_SECRET = 'connectify-single-file-hs256-secret-9f2c7a';
const JWT_EXPIRES_IN = 7 * 24 * 3600; // 7 days, same as the Express version
async function hmacSign(dataStr){
  const key = await crypto.subtle.importKey('raw', enc.encode(JWT_SECRET), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return b64url(await crypto.subtle.sign('HMAC', key, enc.encode(dataStr)));
}
async function signToken(userId){
  const header = b64url(enc.encode(JSON.stringify({ alg: 'HS256', typ: 'JWT' })));
  const now = Math.floor(Date.now() / 1000);
  const payload = b64url(enc.encode(JSON.stringify({ id: userId, iat: now, exp: now + JWT_EXPIRES_IN })));
  const sig = await hmacSign(`${header}.${payload}`);
  return `${header}.${payload}.${sig}`;
}
async function verifyToken(token){
  try{
    const [h, p, sig] = String(token).split('.');
    if (!h || !p || !sig) return null;
    if ((await hmacSign(`${h}.${p}`)) !== sig) return null; // signature check
    let p64 = p.replace(/-/g, '+').replace(/_/g, '/');
    while (p64.length % 4) p64 += '='; // restore base64 padding stripped by base64url
    const payload = JSON.parse(atob(p64));
    if (!payload.id || payload.exp * 1000 < Date.now()) return null; // expiry check
    return payload;
  } catch { return null; }
}

/* ==================================================================
   DATABASE — localStorage collections (mirrors the Mongo models)
   ================================================================== */
const DB_KEY = 'connectify.db.v1';
const TOK_KEY = 'connectify.token';
let db = null;
function loadDB(){
  try { db = JSON.parse(localStorage.getItem(DB_KEY)); } catch { db = null; }
  if (!db || !Array.isArray(db.users)){
    db = { seq: 1, users: [], posts: [], comments: [], likes: [], follows: [], notifications: [] };
  }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function resetDB(){ localStorage.removeItem(DB_KEY); localStorage.removeItem(TOK_KEY); loadDB(); }
const nextId = () => (db.seq++).toString(36).padStart(5, '0') + Math.random().toString(36).slice(2, 6);

const findUser = id => db.users.find(u => u.id === id);
const findUserByUsername = un => db.users.find(u => u.username === String(un || '').toLowerCase());

const likeKey = (userId, postId) => `${userId}|${postId}`;
const followKey = (a, b) => `${a}|${b}`;

  id: u.id, name: u.name, username: u.username, bio: u.bio || '', email: u.email,

});

/* ==================================================================
   API LAYER — same routes, status codes, validation and authorization
   semantics as the Express backend. api(method, path, body) -> data
   or throws {status, message}.
   ================================================================== */
class ApiError extends Error {
  constructor(status, message){ super(message); this.status = status; }
}
const bad = (status, message) => { throw new ApiError(status, message); };

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const USERNAME_RE = /^[a-z0-9_]+$/;

function validateRegister({ name, username, email, password } = {}){
  name = String(name || '').trim();
  username = String(username || '').trim().toLowerCase();
  email = String(email || '').trim().toLowerCase();
  password = String(password || '');
  if (name.length < 2 || name.length > 50) bad(400, 'Name must be between 2 and 50 characters');
  if (!USERNAME_RE.test(username) || username.length < 3 || username.length > 20)
    bad(400, 'Username must be 3-20 chars: lowercase letters, numbers and underscores only');
  if (!EMAIL_RE.test(email)) bad(400, 'Please provide a valid email address');
  if (password.length < 8) bad(400, 'Password must be at least 8 characters');
  return { name, username, email, password };
}
function validateLogin({ email, password } = {}){
  const identifier = String(email || '').trim().toLowerCase();
  if (!identifier) bad(400, 'Email or username is required');
  if (!password) bad(400, 'Password is required');
  return { identifier, password: String(password) };
}
function validatePost({ content } = {}){
  const c = String(content || '').trim();
  if (!c) bad(400, 'Post content is required');
  if (c.length > 1000) bad(400, 'Post content cannot exceed 1000 characters');
  return c;
}
const validateComment = ({ text } = {}) => {
  const t = String(text || '').trim();
  if (!t) bad(400, 'Comment text is required');
  if (t.length > 300) bad(400, 'Comment cannot exceed 300 characters');
  return t;
};

/* auth helper */
async function auth(req){
  const token = (req.headers?.authorization || '').replace(/^Bearer\s+/i, '') || getToken();
  if (!token) bad(401, 'Not authenticated. Please log in');
  const payload = await verifyToken(token);
  if (!payload) bad(401, 'Invalid authentication token');
  const user = findUser(payload.id);
  if (!user) bad(401, 'Account no longer exists');
  return user;
}

/* notification service (skips self-actions, removed on unlike/unfollow) */
function notify({ recipientId, senderId, type, postId = null, commentId = null }){
  if (recipientId === senderId) return; // never notify yourself
  db.notifications.push({
    id: nextId(), recipientId, senderId, type, postId, commentId,
    read: false, createdAt: Date.now(),
  });
}
function removeNotification({ recipientId, senderId, type, postId = null }){
  db.notifications = db.notifications.filter(n =>
    !(n.recipientId === recipientId && n.senderId === senderId && n.type === type &&
      (postId === null || n.postId === postId)));
}

/* paged slice helper */
function pageSlice(arr, page, limit = 10){
  const p = Math.max(1, parseInt(page) || 1);
  const start = (p - 1) * limit;
  return { items: arr.slice(start, start + limit), page: p, hasMore: start + limit < arr.length };
}

/* ---------- the API router (mirrors server/routes) ---------- */
async function api(method, path, body = {}, opts = {}){
  await sleep(120 + Math.random() * 140); // realistic latency so loading states show
  const req = { headers: opts.headers || {} };
  const [pathOnly, queryStr] = path.split('?');
  const q = new URLSearchParams(queryStr || '');
  path = pathOnly; // route literals below match the path WITHOUT its query string
  const seg = pathOnly.replace(/^\/api\//, '').split('/').filter(Boolean);
  const M = method.toUpperCase();

  /* ---- AUTH ---- */
  if (M === 'POST' && path === '/api/auth/register'){
    const v = validateRegister(body);
    if (db.users.some(u => u.email === v.email)) bad(409, `Email "${v.email}" is already registered`);
    if (db.users.some(u => u.username === v.username)) bad(409, `Username "${v.username}" is already taken`);
    const salt = await makeSalt();
    const user = {
      id: nextId(), name: v.name, username: v.username, email: v.email, bio: '',
      salt, passwordHash: await hashPassword(v.password, salt),
      avatar: avatarURI(v.name, hashCode(v.username) % 360),
      followersCount: 0, followingCount: 0, postsCount: 0, createdAt: Date.now(),
    };
    db.users.push(user); saveDB();
    return { status: 201, data: { user: publicUser(user), token: await signToken(user.id) } };
  }
  if (M === 'POST' && path === '/api/auth/login'){
    const { identifier, password } = validateLogin(body);
    const user = db.users.find(u => u.email === identifier || u.username === identifier);
    if (!user) bad(401, 'Invalid credentials. Please check your email/username and password');
    if ((await hashPassword(password, user.salt)) !== user.passwordHash)
      bad(401, 'Invalid credentials. Please check your email/username and password');
    return { status: 200, data: { user: publicUser(user), token: await signToken(user.id) } };
  }
  if (M === 'GET' && path === '/api/auth/me'){
    const user = await auth(req);
    return { status: 200, data: { user: publicUser(user) } };
  }
  if (M === 'POST' && path === '/api/auth/logout'){
    return { status: 200, data: { message: 'Logged out' } };
  }

  /* ---- USERS ---- */
  if (M === 'GET' && seg[0] === 'users' && seg[1] === 'search'){
    const me = await auth(req);
    const term = (q.get('q') || '').trim().toLowerCase();
    let list = db.users;
    if (term) list = list.filter(u => u.name.toLowerCase().includes(term) || u.username.includes(term));
    list = list
      .sort((a, b) => a.name.localeCompare(b.name))
      .slice(0, 12)
      .map(u => ({ ...publicUser(u), isFollowing: db.follows.some(f => f.followerId === me.id && f.followingId === u.id), isSelf: u.id === me.id }));
    return { status: 200, data: { users: list } };
  }
  if (M === 'PUT' && path === '/api/users/me'){
    const me = await auth(req);
    const b = body || {};
    const patch = {};
    if (b.name !== undefined){
      const n = String(b.name).trim();
      if (n.length < 2 || n.length > 50) bad(400, 'Name must be between 2 and 50 characters');
      patch.name = n;
    }
    if (b.username !== undefined){
      const un = String(b.username).trim().toLowerCase();
      if (!USERNAME_RE.test(un) || un.length < 3 || un.length > 20) bad(400, 'Username must be 3-20 chars: lowercase letters, numbers and underscores only');
      if (db.users.some(u => u.username === un && u.id !== me.id)) bad(409, `Username "${un}" is already taken`);
      patch.username = un;
    }
    if (b.email !== undefined){
      const e = String(b.email).trim().toLowerCase();
      if (!EMAIL_RE.test(e)) bad(400, 'Please provide a valid email address');
      if (db.users.some(u => u.email === e && u.id !== me.id)) bad(409, `Email "${e}" is already registered`);
      patch.email = e;
    }
    if (b.bio !== undefined){
      const bio = String(b.bio).trim();
      if (bio.length > 160) bad(400, 'Bio cannot exceed 160 characters');
      patch.bio = bio;
    }
    if (b.avatar !== undefined){
      if (typeof b.avatar !== 'string' || !b.avatar.startsWith('data:image/')) bad(400, 'Avatar must be an uploaded image');
      patch.avatar = b.avatar;
    }
    Object.assign(me, patch); saveDB();
    return { status: 200, data: { user: publicUser(me) } };
  }
  if (M === 'GET' && seg[0] === 'users' && seg[1] === 'username' && seg[3] === 'posts'){
    const viewer = await auth(req);
    const u = findUserByUsername(decodeURIComponent(seg[2])) || bad(404, 'User not found');
    const own = db.posts.filter(p => p.authorId === u.id).sort((a, b) => b.createdAt - a.createdAt);
    const { items, page, hasMore } = pageSlice(own, q.get('page'));
    return { status: 200, data: { user: publicUser(u), posts: items.map(p => postView(p, viewer.id)), page, hasMore } };
  }
  if (M === 'GET' && seg[0] === 'users' && seg[1] === 'username' && (seg[3] === 'followers' || seg[3] === 'following')){
    const me = await auth(req);
    const u = findUserByUsername(decodeURIComponent(seg[2])) || bad(404, 'User not found');
    const ids = seg[3] === 'followers'
      ? db.follows.filter(f => f.followingId === u.id).map(f => f.followerId)
      : db.follows.filter(f => f.followerId === u.id).map(f => f.followingId);
    const users = ids.map(findUser).filter(Boolean).sort((a, b) => b.createdAt - a.createdAt)
      .map(x => ({ ...publicUser(x), isFollowing: db.follows.some(f => f.followerId === me.id && f.followingId === x.id), isSelf: x.id === me.id }));
    return { status: 200, data: { users } };
  }
  if (M === 'GET' && seg[0] === 'users' && seg[1] === 'username'){
    const me = await auth(req);
    const u = findUserByUsername(decodeURIComponent(seg[2])) || bad(404, 'User not found');
    return { status: 200, data: { user: publicUser(u), isFollowing: db.follows.some(f => f.followerId === me.id && f.followingId === u.id), isSelf: u.id === me.id } };
  }

  /* ---- POSTS ---- */
  if (M === 'GET' && path === '/api/posts/feed'){
    const me = await auth(req);
    const sorted = [...db.posts].sort((a, b) => b.createdAt - a.createdAt);
    const { items, page, hasMore } = pageSlice(sorted, q.get('page'));
    return { status: 200, data: { posts: items.map(p => postView(p, me.id)), page, hasMore } };
  }
  if (M === 'POST' && path === '/api/posts'){
    const me = await auth(req);
    const content = validatePost(body);
    if (body.image && !String(body.image).startsWith('data:image/')) bad(400, 'Image must be an uploaded file');
    const post = {
      id: nextId(), authorId: me.id, content, image: body.image || null,
      likeCount: 0, commentCount: 0, createdAt: Date.now(),
    };
    db.posts.push(post); me.postsCount++; saveDB();
    return { status: 201, data: { post: postView(post, me.id) } };
  }
  if (seg[0] === 'posts' && seg[1] && !seg[2]){
    const me = await auth(req);
    const post = findPost(seg[1]) || bad(404, 'Post not found');
    if (M === 'GET') return { status: 200, data: { post: postView(post, me.id) } };
    if (M === 'PUT'){
      if (post.authorId !== me.id) bad(403, 'You can only edit your own posts');
      post.content = validatePost(body); saveDB();
      return { status: 200, data: { post: postView(post, me.id) } };
    }
    if (M === 'DELETE'){
      if (post.authorId !== me.id) bad(403, 'You can only delete your own posts');
      db.posts = db.posts.filter(p => p.id !== post.id);
      db.comments = db.comments.filter(c => c.postId !== post.id);
      db.likes = db.likes.filter(l => l.postId !== post.id);
      db.notifications = db.notifications.filter(n => n.postId !== post.id);
      me.postsCount = Math.max(0, me.postsCount - 1); saveDB();
      return { status: 200, data: { message: 'Post deleted' } };
    }
  }
  if (seg[0] === 'posts' && seg[2] === 'like'){
    const me = await auth(req);
    const post = findPost(seg[1]) || bad(404, 'Post not found');
    if (M === 'POST'){
      if (db.likes.some(l => likeKey(me.id, post.id) === likeKey(l.userId, l.postId)))
        bad(409, 'You have already liked this post');
      db.likes.push({ id: nextId(), userId: me.id, postId: post.id, createdAt: Date.now() });
      post.likeCount++; notify({ recipientId: post.authorId, senderId: me.id, type: 'like', postId: post.id }); saveDB();
      return { status: 200, data: { liked: true, likeCount: post.likeCount } };
    }
    if (M === 'DELETE'){
      const before = db.likes.length;
      db.likes = db.likes.filter(l => !(l.userId === me.id && l.postId === post.id));
      if (db.likes.length === before) bad(404, 'You have not liked this post');
      post.likeCount = Math.max(0, post.likeCount - 1);
      removeNotification({ recipientId: post.authorId, senderId: me.id, type: 'like', postId: post.id }); saveDB();
      return { status: 200, data: { liked: false, likeCount: post.likeCount } };
    }
  }
  if (M === 'GET' && seg[0] === 'posts' && seg[2] === 'likes'){
    await auth(req);
    const post = findPost(seg[1]) || bad(404, 'Post not found');
    const users = db.likes.filter(l => l.postId === post.id).map(l => findUser(l.userId)).filter(Boolean)
      .map(publicUser);
    return { status: 200, data: { users } };
  }
  if (M === 'GET' && seg[0] === 'posts' && seg[2] === 'comments'){
    const me = await auth(req);
    const post = findPost(seg[1]) || bad(404, 'Post not found');
    const list = db.comments.filter(c => c.postId === post.id).sort((a, b) => a.createdAt - b.createdAt);
    return { status: 200, data: { comments: list.map(c => commentView(c, me.id)) } };
  }

  /* ---- COMMENTS ---- */
  if (M === 'POST' && seg[0] === 'comments' && !seg[1]){
    const me = await auth(req);
    const text = validateComment(body);
    const post = findPost(body.postId) || bad(404, 'Post not found');
    const c = { id: nextId(), postId: post.id, authorId: me.id, text, createdAt: Date.now() };
    db.comments.push(c); post.commentCount++;
    notify({ recipientId: post.authorId, senderId: me.id, type: 'comment', postId: post.id, commentId: c.id }); saveDB();
    return { status: 201, data: { comment: commentView(c, me.id) } };
  }
  if (M === 'DELETE' && seg[0] === 'comments' && seg[1]){
    const me = await auth(req);
    const c = findComment(seg[1]) || bad(404, 'Comment not found');
    if (c.authorId !== me.id) bad(403, 'You can only delete your own comments');
    db.comments = db.comments.filter(x => x.id !== c.id);
    const post = findPost(c.postId);
    if (post) post.commentCount = Math.max(0, post.commentCount - 1);
    db.notifications = db.notifications.filter(n => n.commentId !== c.id); saveDB();
    return { status: 200, data: { message: 'Comment deleted' } };
  }

  /* ---- FOLLOWS ---- */
  if (seg[0] === 'follows' && seg[1]){
    const me = await auth(req);
    const target = findUser(seg[1]) || bad(404, 'User not found');
    if (M === 'POST'){
      if (target.id === me.id) bad(400, 'You cannot follow yourself');
      if (db.follows.some(f => followKey(f.followerId, f.followingId) === followKey(me.id, target.id)))
        bad(409, 'You are already following this user');
      db.follows.push({ id: nextId(), followerId: me.id, followingId: target.id, createdAt: Date.now() });
      me.followingCount++; target.followersCount++;
      notify({ recipientId: target.id, senderId: me.id, type: 'follow' }); saveDB();
      return { status: 200, data: { following: true, followersCount: target.followersCount } };
    }
    if (M === 'DELETE'){
      const before = db.follows.length;
      db.follows = db.follows.filter(f => !(f.followerId === me.id && f.followingId === target.id));
      if (db.follows.length === before) bad(404, 'You are not following this user');
      me.followingCount = Math.max(0, me.followingCount - 1);
      target.followersCount = Math.max(0, target.followersCount - 1);
      removeNotification({ recipientId: target.id, senderId: me.id, type: 'follow' }); saveDB();
      return { status: 200, data: { following: false, followersCount: target.followersCount } };
    }
  }

  /* ---- NOTIFICATIONS ---- */
  if (M === 'GET' && path === '/api/notifications/unread-count'){
    const me = await auth(req);
    return { status: 200, data: { count: db.notifications.filter(n => n.recipientId === me.id && !n.read).length } };
  }
  if (M === 'PUT' && path === '/api/notifications/read-all'){
    const me = await auth(req);
    db.notifications.forEach(n => { if (n.recipientId === me.id) n.read = true; }); saveDB();
    return { status: 200, data: { message: 'All notifications marked as read' } };
  }
  if (M === 'GET' && path === '/api/notifications'){
    const me = await auth(req);
    const mine = db.notifications.filter(n => n.recipientId === me.id).sort((a, b) => b.createdAt - a.createdAt);
    const { items, page, hasMore } = pageSlice(mine, q.get('page'));
    const notifications = items.map(n => ({
      id: n.id, type: n.type, read: n.read, createdAt: n.createdAt,
      sender: authorCard(findUser(n.senderId)) || null,
      post: n.postId ? (p => p && { id: p.id, content: p.content })(findPost(n.postId)) : null,
      comment: n.commentId ? (c => c && { id: c.id, text: c.text })(findComment(n.commentId)) : null,
    }));
    return { status: 200, data: { notifications, page, hasMore, unreadCount: mine.filter(n => !n.read).length } };
  }
  if (M === 'PUT' && seg[0] === 'notifications' && seg[2] === 'read'){
    const me = await auth(req);
    const n = db.notifications.find(x => x.id === seg[1]) || bad(404, 'Notification not found');
    if (n.recipientId !== me.id) bad(403, 'Not your notification');
    n.read = true; saveDB();
    return { status: 200, data: { message: 'Notification marked as read' } };
  }

  bad(404, `Route ${M} ${path} not found`);
}

/* token storage helpers */
const getToken = () => localStorage.getItem(TOK_KEY);
const setToken = t => t ? localStorage.setItem(TOK_KEY, t) : localStorage.removeItem(TOK_KEY);

/* convenient wrapper used by views: returns data or throws ApiError */
async function request(method, path, body){
  try{
    const res = await api(method, path, body);
    return res.data;
  } catch (err){
    if (err instanceof ApiError){
      if (err.status === 401){ setToken(null); currentUser = null; }
      err.userMessage = err.message;
    }
    throw err;
  }
}

/* ---------- toasts + dialogs ---------- */
function toast(msg, type = 'ok'){
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : '');
  el.innerHTML = `${type === 'err' ? ic('x', 15) : ic('check', 15)}<span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 2600);
}
function confirmDialog({ title, message, confirmLabel = 'Confirm', danger = false }){
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <h3>${esc(title)}</h3><p>${esc(message)}</p>
        <div class="row">
          <button class="btn btn-outline" data-r="0">Cancel</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-r="1">${esc(confirmLabel)}</button>
        </div>
      </div>`;
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (b){ ov.remove(); resolve(b.dataset.r === '1'); }
      else if (e.target === ov){ ov.remove(); resolve(false); }
    });
    document.body.appendChild(ov);
    ov.querySelector('[data-r="1"]').focus();
  });
}
function zoomModal(src){
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';

}

/* ---------- client-side image resize (the "multer" of this file) ---------- */
function resizeImage(file, maxDim = 900, quality = 0.72){
  return new Promise((resolve, reject) => {
    if (!/^image\/(jpeg|png|gif|webp)$/.test(file.type)) return reject(new Error('Only JPEG, PNG, GIF or WebP images are allowed'));
    if (file.size > 5 * 1024 * 1024) return reject(new Error('Image is too large. Maximum size is 5MB'));
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read that image'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.readAsDataURL(file);
  });
}

/* ---------- router ---------- */
const ROUTES = [
  { re: /^#\/(login)$/,            page: 'login',        view: LoginPage },
  { re: /^#\/(register)$/,         page: 'register',     view: RegisterPage },
  { re: /^#\/$/,                   page: 'feed',         view: FeedPage,      auth: true },
  { re: /^#\/search(?:\?q=(.*))?$/,page: 'search',       view: SearchPage,   auth: true },
  { re: /^#\/notifications$/,      page: 'notifications',view: NotificationsPage, auth: true },
  { re: /^#\/profile\/([^?]+)$/,   page: 'profile',      view: ProfilePage,  auth: true },
  { re: /^#\/post\/([^?]+)$/,      page: 'post',         view: PostDetailPage, auth: true },
  { re: /^#\/settings\/profile$/,  page: 'editProfile',  view: EditProfilePage, auth: true },
];
async function render(){
  const hash = location.hash || '#/';
  const route = ROUTES.find(r => r.re.test(hash));
  if (!route){ location.replace(currentUser ? '#/' : '#/login'); return; }
  if (route.auth && !currentUser){ location.replace('#/login'); return; }
  if ((route.page === 'login' || route.page === 'register') && currentUser){ location.replace('#/'); return; }

  if (currentUser){
    if (!document.querySelector('.navbar')) renderShell();
    markActiveNav(route.page === 'post' ? 'feed' : route.page === 'editProfile' ? 'profile' : route.page);
    refreshBadge();
  }
  const m = hash.match(route.re);
  await route.view(document.getElementById('view') || $app, m);
}
window.addEventListener('hashchange', render);

async function FeedPage(view){
  document.title = 'Feed — Connectify';
  view.innerHTML = `

            </div>

        </div>

          </div>
          <div class="flex-center">
            <span class="char-count" id="composer-count">1000</span>
            <button class="btn btn-primary" type="submit" id="composer-btn" disabled style="margin-left:10px">Post</button>
          </div>
        </div>
      </form>
    </div>
    <div id="feed-list">${skeletonPosts(4)}</div>
    <div class="center-load" id="feed-more"></div>`;

  /* composer logic */
  let imageData = null;
  const ta = view.querySelector('#composer-text'), btn = view.querySelector('#composer-btn'),
        cnt = view.querySelector('#composer-count'), file = view.querySelector('#composer-file');
  const upd = () => {
    const remaining = 1000 - ta.value.length;
    cnt.textContent = remaining; cnt.classList.toggle('over', remaining < 0);
    btn.disabled = !ta.value.trim() || remaining < 0;
  };
  ta.addEventListener('input', upd);
  view.querySelector('#composer-attach').addEventListener('click', () => file.click());
  file.addEventListener('change', async () => {
    if (!file.files[0]) return;
    try{
      imageData = await resizeImage(file.files[0]);
      view.querySelector('#composer-preview-img').src = imageData;
      view.querySelector('#composer-preview').hidden = false;
    } catch (err){ toast(err.message, 'err'); }
    file.value = '';
  });
  view.querySelector('#composer-remove').addEventListener('click', () => {
    imageData = null; view.querySelector('#composer-preview').hidden = true;
  });
  view.querySelector('#composer-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errBox = view.querySelector('#composer-error'); errBox.innerHTML = '';
    btn.disabled = true; btn.innerHTML = '<span class="spinner light"></span>';
    try{
      const d = await request('POST', '/api/posts', { content: ta.value, image: imageData });
      ta.value = ''; imageData = null; view.querySelector('#composer-preview').hidden = true; upd();
      feedState.posts.unshift(d.post);
      const list = view.querySelector('#feed-list');
      list.querySelector('.empty')?.closest('.card')?.remove();
      list.insertAdjacentHTML('afterbegin', postCardHTML(d.post));
      toast('Post created');
    } catch (err){
      errBox.innerHTML = errorBox(err.userMessage || 'Could not create post');
    }
    btn.textContent = 'Post'; upd();
  });

  /* feed load */
  try{
    const d = await request('GET', '/api/posts/feed?page=1');
    feedState.posts = d.posts; feedState.page = d.page; feedState.hasMore = d.hasMore;
    view.querySelector('#feed-list').innerHTML = d.posts.length
      ? d.posts.map(postCardHTML).join('')
      : emptyState('spark', 'No posts yet', 'Be the first to share something with the community!');
    renderMoreBtn();
  } catch (err){
    view.querySelector('#feed-list').innerHTML = errorBox(err.userMessage || 'Could not load feed');
  }
  function renderMoreBtn(){
    const slot = view.querySelector('#feed-more');
    slot.innerHTML = feedState.hasMore ? `<button class="btn btn-outline" id="feed-more-btn">${feedState.loadingMore ? '<span class="spinner"></span>' : ''} Load more posts</button>` : '';
    slot.querySelector('#feed-more-btn')?.addEventListener('click', loadMore);
  }
  async function loadMore(){
    feedState.loadingMore = true; renderMoreBtn();
    try{
      const d = await request('GET', `/api/posts/feed?page=${feedState.page + 1}`);
      feedState.posts.push(...d.posts); feedState.page = d.page; feedState.hasMore = d.hasMore;
      view.querySelector('#feed-list').insertAdjacentHTML('beforeend', d.posts.map(postCardHTML).join(''));
    } catch (err){ toast(err.userMessage || 'Could not load more posts', 'err'); }
    feedState.loadingMore = false; renderMoreBtn();
  }
}

/* ---------- comments section ---------- */
async function loadComments(article, postId){
  const box = article.querySelector('[data-comments]');
  if (box.dataset.loaded === '1') return;
  box.innerHTML = '<div class="loader-wrap" style="padding:14px 0"><span class="spinner"></span> Loading comments...</div>';
  try{
    const d = await request('GET', `/api/posts/${postId}/comments`);
    box.innerHTML = commentsHTML(d.comments) + commentFormHTML();
    box.dataset.loaded = '1';
  } catch (err){
    box.innerHTML = errorBox(err.userMessage || 'Could not load comments');
  }
}
function commentsHTML(comments){
  if (!comments.length) return `<p class="hint" style="margin:4px 0 2px">No comments yet — start the conversation.</p>`;
  return comments.map(c => `
    <div class="comment" data-comment-id="${c.id}">
      <a href="#/profile/${esc(c.author.username)}">${avatarImg(c.author, 'av-sm')}</a>
      <div class="body">
        <div class="meta"><b>${esc(c.author.name)}</b> @${esc(c.author.username)} · ${timeAgo(c.createdAt)}</div>
        <div class="txt">${esc(c.text)}</div>
      </div>
      ${c.isOwner ? `<button class="del" data-action="delete-comment" aria-label="Delete comment">${ic('trash', 14)}</button>` : ''}
    </div>`).join('');
}
function commentFormHTML(){
  return `
  <form class="comment-form" data-comment-form>
    <input class="input" type="text" placeholder="Write a comment..." maxlength="300" aria-label="Write a comment">
    <button class="btn btn-primary btn-icon" type="submit" disabled aria-label="Send comment" style="width:42px;height:42px">${ic('send', 16)}</button>
  </form>`;
}
function bindCommentForm(article, postId, post){
  const form = article.querySelector('[data-comment-form]');
  if (!form) return;
  const input = form.querySelector('input'), btn = form.querySelector('button');
  input.addEventListener('input', () => { btn.disabled = !input.value.trim(); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    btn.disabled = true;
    try{
      const d = await request('POST', '/api/comments', { postId, text });
      const box = article.querySelector('[data-comments]');
      box.querySelector('.hint')?.remove();
      box.querySelector('[data-comment-form]')?.insertAdjacentHTML('beforebegin', commentsHTML([d.comment]));
      input.value = ''; btn.disabled = true; input.focus();
      post.commentCount++;
      article.querySelector('[data-count="comment"]').textContent = post.commentCount;
      if (d.comment.author.id !== post.author.id) refreshBadge();
    } catch (err){ toast(err.userMessage || 'Could not add comment', 'err'); btn.disabled = false; }
  });
}

/* ---------- delegated card actions (like / menu / comments / zoom) ---------- */
document.addEventListener('click', async e => {
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;

  /* zoom image */
  if (action === 'zoom'){ zoomModal(actionEl.src); return; }

  /* post owner dropdown */
  if (action === 'menu'){
    const wrap = actionEl.closest('.post-menu-wrap');
    const menu = wrap.querySelector('.post-menu');
    const open = !menu.hidden;
    document.querySelectorAll('.post-menu').forEach(m => m.hidden = true);
    menu.hidden = open;
    actionEl.setAttribute('aria-expanded', String(!open));
    return;
  }

  const article = actionEl.closest('.post-card');
  if (!article) return;
  const postId = article.dataset.postId;
  const post = findInState(postId);
  if (!post) return;

  /* optimistic like toggle */
  if (action === 'like'){
    const btn = article.querySelector('.like-btn');
    const count = article.querySelector('[data-count="like"]');
    const wasLiked = btn.classList.contains('liked');
    // optimistic flip
    btn.classList.toggle('liked', !wasLiked);
    btn.setAttribute('aria-pressed', String(!wasLiked));
    btn.setAttribute('aria-label', wasLiked ? 'Like post' : 'Unlike post');
    btn.innerHTML = `${wasLiked ? ic('heart', 17) : heartFilled(17)}<span data-count="like">${post.likeCount + (wasLiked ? -1 : 1)}</span>`;
    try{
      const d = wasLiked
        ? await request('DELETE', `/api/posts/${postId}/like`)
        : await request('POST', `/api/posts/${postId}/like`);
      post.likedByMe = d.liked; post.likeCount = d.likeCount;
      btn.querySelector('[data-count="like"]').textContent = d.likeCount;
      if (!wasLiked && post.author.id !== currentUser.id) refreshBadge();
    } catch (err){
      // revert on failure
      btn.classList.toggle('liked', wasLiked);
      btn.setAttribute('aria-pressed', String(wasLiked));
      btn.setAttribute('aria-label', wasLiked ? 'Unlike post' : 'Like post');
      btn.innerHTML = `${wasLiked ? heartFilled(17) : ic('heart', 17)}<span data-count="like">${post.likeCount}</span>`;
      toast(err.userMessage || 'Like failed', 'err');
    }
    return;
  }

  /* comments expand / collapse */
  if (action === 'toggle-comments'){
    const box = article.querySelector('[data-comments]');
    const btn = actionEl.closest('.stat-btn');
    const open = box.hidden;
    box.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    if (open){ await loadComments(article, postId); bindCommentForm(article, postId, post); }
    return;
  }

  /* delete comment */
  if (action === 'delete-comment'){
    const row = actionEl.closest('.comment');
    const ok = await confirmDialog({ title: 'Delete comment?', message: 'This cannot be undone.', confirmLabel: 'Delete', danger: true });
    if (!ok) return;
    try{
      await request('DELETE', `/api/comments/${row.dataset.commentId}`);
      row.remove(); post.commentCount = Math.max(0, post.commentCount - 1);
      article.querySelector('[data-count="comment"]').textContent = post.commentCount;
      toast('Comment deleted');
    } catch (err){ toast(err.userMessage || 'Could not delete comment', 'err'); }
    return;
  }

  /* edit post (inline) */
  if (action === 'edit-post'){
    article.querySelector('.post-menu').hidden = true;
    const body = article.querySelector('[data-body]');
    if (body.querySelector('textarea')) return;
    const original = post.content;
    body.innerHTML = `
      <div class="edit-area">
        <textarea class="textarea" maxlength="1050">${esc(original)}</textarea>
        <div class="row">
          <button class="btn btn-outline btn-sm" data-action="cancel-edit">Cancel</button>
          <button class="btn btn-primary btn-sm" data-action="save-edit">Save</button>
        </div>
      </div>`;
    const ta = body.querySelector('textarea');
    ta.style.minHeight = '80px'; ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    return;
  }
  if (action === 'cancel-edit'){
    article.querySelector('[data-body]').textContent = post.content;
    return;
  }
  if (action === 'save-edit'){
    const ta = article.querySelector('[data-body] textarea');
    const content = ta.value.trim();
    if (!content){ toast('Post content is required', 'err'); return; }
    try{
      const d = await request('PUT', `/api/posts/${postId}`, { content });
      Object.assign(post, d.post);
      article.querySelector('[data-body]').textContent = d.post.content;
      toast('Post updated');
    } catch (err){ toast(err.userMessage || 'Could not update post', 'err'); }
    return;
  }

  /* delete post */
  if (action === 'delete-post'){
    article.querySelector('.post-menu').hidden = true;
    const ok = await confirmDialog({ title: 'Delete post?', message: 'The post, its likes and comments will be removed permanently.', confirmLabel: 'Delete', danger: true });
    if (!ok) return;
    try{
      await request('DELETE', `/api/posts/${postId}`);
      removeFromState(postId);
      if (location.hash.startsWith('#/post/')){ location.hash = '#/'; }
      else { article.remove(); if (currentUser) currentUser.postsCount = Math.max(0, currentUser.postsCount - 1); }
      toast('Post deleted');
    } catch (err){ toast(err.userMessage || 'Could not delete post', 'err'); }
    return;
  }
});

/* helpers to find post objects across page states */
function findInState(postId){
  return feedState.posts.find(p => p.id === postId)
      || (profileState.posts || []).find(p => p.id === postId)
      || (detailState.post && detailState.post.id === postId ? detailState.post : null);
}
function removeFromState(postId){
  feedState.posts = feedState.posts.filter(p => p.id !== postId);
  if (profileState.posts) profileState.posts = profileState.posts.filter(p => p.id !== postId);
  if (detailState.post && detailState.post.id === postId) detailState.post = null;
}

});

      <div class="cover"></div>
      <div class="profile-avatar-lg">${avatarImg(u, 'av-lg').replace('av-lg', 'av-lg" style="width:100%;height:100%')}</div>
      <h2 style="font-size:20px;letter-spacing:-.3px">${esc(u.name)}</h2>
      <div style="color:var(--text-3);font-size:14px">@${esc(u.username)}</div>
      ${u.bio ? `<p class="bio">${esc(u.bio)}</p>` : ''}
      <div class="counters">
        <div class="counter"><b>${u.postsCount}</b><span>Posts</span></div>
        <div class="counter"><b data-counter="followers">${u.followersCount}</b><span>Followers</span></div>
        <div class="counter"><b data-counter="following">${u.followingCount}</b><span>Following</span></div>
      </div>
      <div class="profile-actions">
        ${d.isSelf
          ? `<a class="btn btn-soft" href="#/settings/profile">${ic('pencil', 14)} Edit profile</a>`
          : `<button class="btn ${d.isFollowing ? 'btn-outline' : 'btn-primary'}" data-action="follow"
               data-uid="${u.id}" data-uname="${esc(u.username)}" data-following="${d.isFollowing}">${d.isFollowing ? 'Unfollow' : 'Follow'}</button>`}
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="posts" aria-selected="true">Posts</button>
      <button class="tab" role="tab" data-tab="followers" aria-selected="false">Followers</button>
      <button class="tab" role="tab" data-tab="following" aria-selected="false">Following</button>
    </div>
    <div id="tab-body">${skeletonPosts(3)}</div>
    <div class="center-load" id="tab-more"></div>`;

  const tabBody = view.querySelector('#tab-body'), tabMore = view.querySelector('#tab-more');

  async function loadPosts(next = 1){
    try{
      const r = await request('GET', `/api/users/username/${encodeURIComponent(username)}/posts?page=${next}`);
      profileState.posts = next === 1 ? r.posts : [...profileState.posts, ...r.posts];
      profileState.page = r.page; profileState.hasMore = r.hasMore;
      if (next === 1){
        tabBody.innerHTML = r.posts.length ? r.posts.map(p => postCardHTML(p)).join('')
          : emptyState('spark', d.isSelf ? 'You have not posted yet' : 'No posts yet',
              d.isSelf ? 'Share your first thought with the community from the home feed.' : `When ${u.name} posts, it will show up here.`);
      } else {
        tabBody.insertAdjacentHTML('beforeend', r.posts.map(p => postCardHTML(p)).join(''));
      }
      tabMore.innerHTML = profileState.hasMore ? `<button class="btn btn-outline" id="p-more-btn">Load more posts</button>` : '';
      tabMore.querySelector('#p-more-btn')?.addEventListener('click', () => loadPosts(profileState.page + 1));
    } catch (err){ tabBody.innerHTML = errorBox(err.userMessage || 'Could not load posts'); }
  }
  async function loadList(kind){
    tabBody.innerHTML = '<div class="loader-wrap"><span class="spinner"></span> Loading...</div>'; tabMore.innerHTML = '';
    try{
      const r = await request('GET', `/api/users/username/${encodeURIComponent(username)}/${kind}`);
      tabBody.innerHTML = `<div class="card">${r.users.length ? r.users.map(userRowHTML).join('') :
        `<div class="empty"><div class="ico">${ic('user', 24)}</div><b>${kind === 'followers' ? 'No followers yet' : 'Not following anyone yet'}</b><p>${kind === 'followers' ? 'When people follow this account, they will appear here.' : 'Accounts this user follows will appear here.'}</p></div>`}</div>`;
    } catch (err){ tabBody.innerHTML = errorBox(err.userMessage || 'Could not load list'); }
  }

  view.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
    if (tab.dataset.tab === profileState.tab) return;
    view.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
    tab.classList.add('active'); tab.setAttribute('aria-selected', 'true');
    profileState.tab = tab.dataset.tab;
    if (profileState.tab === 'posts') loadPosts(1);
    else loadList(profileState.tab);
  }));

  loadPosts(1);
}

/* ---------- SEARCH ---------- */
async function SearchPage(view, m){
  document.title = 'Search — Connectify';
  const initialQ = m[1] ? decodeURIComponent(m[1]) : '';
  view.innerHTML = `
    <div class="page-fade">
      <div class="card search-hero">
        <h3>Search users</h3><p>Find people by name or @username and follow them.</p>
      </div>
      <div class="search-bar" style="margin-top:14px">
        <div class="input-wrap"><span class="input-icon">${ic('search', 15)}</span>
          <input class="input" id="search-input" type="search" placeholder="Search users by name or username"
            value="${esc(initialQ)}" aria-label="Search users by name or username">
        </div>
      </div>
      <div id="search-results">
        <div class="loader-wrap"><span class="spinner"></span> Loading people...</div>
      </div>
    </div>`;
  const input = view.querySelector('#search-input'), results = view.querySelector('#search-results');
  let timer = null;
  async function run(q){
    try{
      const d = await request('GET', `/api/users/search?q=${encodeURIComponent(q)}`);
      results.innerHTML = d.users.length
        ? `<div class="card">${d.users.map(userRowHTML).join('')}</div>`
        : emptyState('search', 'No users found', `Nobody matches "${q}". Try a different name or username.`);
    } catch (err){ results.innerHTML = errorBox(err.userMessage || 'Search failed'); }
  }
  input.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => run(input.value.trim()), 300);
  });
  run(initialQ);
}

/* ---------- NOTIFICATIONS ---------- */
const NOTIF_VERBS = { like: 'liked your post', comment: 'commented on your post', follow: 'started following you' };
const NOTIF_ICONS = { like: heartFilled(15), comment: ic('comment', 15), follow: ic('userPlus', 15) };
function notifHTML(n){
  const who = n.sender ? n.sender.name : 'Someone';
  const snippet = n.comment?.text || n.post?.content || '';
  return `
  <div class="notif-item ${n.read ? '' : 'unread'}" data-notif-id="${n.id}" data-type="${n.type}"
       data-post="${n.post?.id || ''}" data-username="${n.sender?.username || ''}" role="button" tabindex="0"
       aria-label="${esc(who)} ${NOTIF_VERBS[n.type]}">
    <div class="notif-icon ${n.type}">${NOTIF_ICONS[n.type]}</div>
    <div class="notif-body">
      <div class="notif-text"><b>${esc(who)}</b> ${NOTIF_VERBS[n.type] || 'interacted with you'}</div>
      ${snippet ? `<div class="notif-snippet">“${esc(snippet.slice(0, 70))}${snippet.length > 70 ? '…' : ''}”</div>` : ''}
      <div class="notif-time">${timeAgo(n.createdAt)}</div>
    </div>
    ${n.sender ? avatarImg(n.sender, 'av-sm') : ''}
    ${n.read ? '' : '<span class="unread-dot" aria-label="Unread"></span>'}
  </div>`;
}
async function NotificationsPage(view){
  document.title = 'Notifications — Connectify';
  view.innerHTML = `
    <div class="page-fade">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div class="page-heading" style="margin:0">Notifications</div>
        <button class="btn btn-soft btn-sm" id="read-all" hidden>${ic('check', 14)} Mark all read</button>
      </div>
      <div id="notif-list"><div class="card"><div class="loader-wrap"><span class="spinner"></span> Loading notifications...</div></div></div>
      <div class="center-load" id="notif-more"></div>
    </div>`;
  const list = view.querySelector('#notif-list'), more = view.querySelector('#notif-more'), readAllBtn = view.querySelector('#read-all');
  let page = 1, hasMore = false, items = [];
  async function load(next = 1){
    try{
      const d = await request('GET', `/api/notifications?page=${next}`);
      items = next === 1 ? d.notifications : [...items, ...d.notifications];
      page = d.page; hasMore = d.hasMore;
      list.innerHTML = `<div class="card" style="overflow:hidden;padding:0">${items.length ? items.map(notifHTML).join('') :
        `<div class="empty"><div class="ico">${ic('bell', 24)}</div><b>No notifications yet</b><p>When someone likes or comments on your posts, or follows you, it will show up here.</p></div>`}</div>`;
      readAllBtn.hidden = !items.some(n => !n.read);
      more.innerHTML = hasMore ? '<button class="btn btn-outline" id="n-more">Load more</button>' : '';
      more.querySelector('#n-more')?.addEventListener('click', () => load(page + 1));
    } catch (err){ list.innerHTML = errorBox(err.userMessage || 'Could not load notifications'); }
  }
  readAllBtn.addEventListener('click', async () => {
    try{
      await request('PUT', '/api/notifications/read-all');
      items.forEach(n => n.read = true);
      list.querySelectorAll('.notif-item').forEach(r => { r.classList.remove('unread'); r.querySelector('.unread-dot')?.remove(); });
      readAllBtn.hidden = true; refreshBadge(); toast('All notifications marked as read');
    } catch (err){ toast(err.userMessage || 'Failed', 'err'); }
  });
  list.addEventListener('click', async e => {
    const row = e.target.closest('.notif-item');
    if (!row) return;
    if (row.classList.contains('unread')){
      row.classList.remove('unread'); row.querySelector('.unread-dot')?.remove();
      request('PUT', `/api/notifications/${row.dataset.notifId}/read`).then(refreshBadge).catch(() => {});
      if (items.find(n => n.id === row.dataset.notifId)) items.find(n => n.id === row.dataset.notifId).read = true;
      readAllBtn.hidden = !items.some(n => !n.read);
    }
    if (row.dataset.type === 'follow' && row.dataset.username) location.hash = `#/profile/${row.dataset.username}`;
    else if (row.dataset.post) location.hash = `#/post/${row.dataset.post}`;
  });
  await load(1);
}

/* ---------- POST DETAIL ---------- */
async function PostDetailPage(view, m){
  const id = m[1];
  document.title = 'Post — Connectify';
  view.innerHTML = `<a href="#/" class="hint" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:12px">← Back to feed</a><div id="detail-root">${skeletonPosts(1)}</div>`;
  let post;
  try{
    const d = await request('GET', `/api/posts/${id}`);
    post = d.post; detailState.post = post;
  } catch (err){
    view.querySelector('#detail-root').innerHTML = emptyState('x', 'Post not found', 'It may have been deleted by its author.');
    return;
  }
  document.title = `${post.author.name}: ${post.content.slice(0, 30)}... — Connectify`;
  const root = view.querySelector('#detail-root');
  root.innerHTML = postCardHTML(post, { openComments: true });
  const article = root.querySelector('.post-card');
  article.querySelector('[data-comments]').hidden = false;
  article.querySelector('.comment-btn').setAttribute('aria-expanded', 'true');
  await loadComments(article, id);
  bindCommentForm(article, id, post);
}

/* ---------- EDIT PROFILE ---------- */
async function EditProfilePage(view){
  document.title = 'Edit profile — Connectify';
  const u = currentUser;
  view.innerHTML = `
  <div class="page-fade">
    <div class="page-heading">Edit profile</div>
    <div class="card" style="padding:20px">
      <div id="ep-error"></div>
      <div class="avatar-edit">
        <span id="ep-avatar">${avatarImg(u, 'av-lg')}</span>
        <div>
          <input type="file" id="ep-file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
          <button class="btn btn-outline btn-sm" id="ep-change">${ic('image', 14)} Change photo</button>
          <p class="hint">JPEG, PNG, GIF or WebP · max 5MB</p>
        </div>
      </div>
      <form id="ep-form" novalidate>
        <div class="field"><label for="ep-name">Full name</label>
          <input id="ep-name" class="input" type="text" value="${esc(u.name)}" maxlength="50"></div>
        <div class="field"><label for="ep-username">Username</label>
          <input id="ep-username" class="input" type="text" value="${esc(u.username)}" maxlength="20">
          <p class="hint">Changing this also changes your profile URL</p></div>
        <div class="field"><label for="ep-bio">Bio</label>
          <textarea id="ep-bio" class="textarea" maxlength="160" rows="3" placeholder="Tell people about yourself...">${esc(u.bio)}</textarea>
          <p class="hint"><span id="ep-bio-count">${160 - u.bio.length}</span> characters left</p></div>
        <div class="field"><label for="ep-email">Email</label>
          <input id="ep-email" class="input" type="email" value="${esc(u.email)}"></div>
        <div style="display:flex;gap:9px;justify-content:flex-end">
          <a class="btn btn-outline" href="#/profile/${esc(u.username)}">Cancel</a>
          <button class="btn btn-primary" type="submit" id="ep-save">Save changes</button>
        </div>
      </form>
    </div>
  </div>`;
  let avatarData = null;
  const f = id => view.querySelector(id);
  f('#ep-change').addEventListener('click', () => f('#ep-file').click());
  f('#ep-file').addEventListener('change', async () => {
    if (!f('#ep-file').files[0]) return;
    try{
      avatarData = await resizeImage(f('#ep-file').files[0], 300, 0.8);
      f('#ep-avatar').innerHTML = `<img class="avatar av-lg" src="${avatarData}" alt="New avatar preview">`;
    } catch (err){ toast(err.message, 'err'); }
    f('#ep-file').value = '';
  });
  const bioEl = f('#ep-bio'), bioCnt = f('#ep-bio-count');
  bioEl.addEventListener('input', () => bioCnt.textContent = 160 - bioEl.value.length);
  f('#ep-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errBox = f('#ep-error'); errBox.innerHTML = '';
    const btn = f('#ep-save'); btn.disabled = true; btn.innerHTML = '<span class="spinner light"></span> Saving...';
    const payload = {
      name: f('#ep-name').value, username: f('#ep-username').value,
      bio: bioEl.value, email: f('#ep-email').value,
    };
    if (avatarData) payload.avatar = avatarData;
    try{
      const d = await request('PUT', '/api/users/me', payload);
      currentUser = d.user;
      toast('Profile updated');
      location.hash = `#/profile/${d.user.username}`;
    } catch (err){
      errBox.innerHTML = errorBox(err.userMessage || 'Could not update profile');
      btn.disabled = false; btn.textContent = 'Save changes';
    }
  });
}

/* ==================================================================
   BOOT — load database, seed on first run, restore session, render
   ================================================================== */
(async function boot(){
  $app.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text-3)"><span class="spinner"></span>&nbsp;Loading Connectify...</div>';
  loadDB();
  if (!db.users.length){ await seedDB(); }
  if (getToken()){
    try{ const d = await request('GET', '/api/auth/me'); currentUser = d.user; }
    catch { /* invalid/expired token already cleared by request() */ }
  }
  if (!location.hash) location.hash = currentUser ? '#/' : '#/login';
  render();
})();
</script>
