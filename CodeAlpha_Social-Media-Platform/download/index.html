    toprow.append(
      el(`<a href="#/settings/profile" class="btn btn-outline btn-sm">${Icons.settings(15)} Edit profile</a>`),
      el(`<a href="#/settings/profile" class="btn btn-soft btn-sm" aria-label="Change profile picture">${Icons.camera(15)} Photo</a>`)
    );
  } else {
    toprow.append(FollowButton(
      { ...profile.user, isFollowing: profile.isFollowing, isSelf: false },
      { onChange: (delta, following, followersCount) => {
          profile.isFollowing = following;
          profile.user.followersCount = followersCount != null ? followersCount : Math.max(0, profile.user.followersCount + delta);
          repaintTabs();
          if (profile.tab === 'followers') loadUsers('followers');
        } }
    ));
  }

  /* ---- tabs ---- */
  const repaintTabs = () => {
    tabsEl.innerHTML = '';
    PROFILE_TABS.forEach((t) => {
      const count = t.key === 'posts' ? profile.user.postsCount : t.key === 'followers' ? profile.user.followersCount : profile.user.followingCount;
      const btn = el(
        `<button type="button" role="tab" aria-selected="${profile.tab === t.key}" class="tab${profile.tab === t.key ? ' active' : ''}">${formatCount(count || 0)} &middot; ${t.label}</button>`
      );
      btn.addEventListener('click', () => {
        if (profile.tab === t.key) return;
        profile.tab = t.key;
        repaintTabs();
        renderTab();
      });
      tabsEl.append(btn);
    });
  };

  const renderTab = () => {
    content.innerHTML = '';
    if (profile.tab === 'posts') loadPosts();
    else loadUsers(profile.tab);
  };

  const loadPosts = async () => {
    content.append(Loader('Loading posts...'));
    await delay(220);
    if (!alive()) return;
    content.innerHTML = '';
    try {
      const { posts } = api.users.posts(profile.user.username, state.me._id);
      profile.posts = posts;
      if (posts.length === 0) {
        content.append(EmptyState(
          Icons.comment(26),
          profile.isSelf ? "You haven't posted yet" : `@${profile.user.username} hasn't posted yet`,
          profile.isSelf
            ? 'Share your first thought from the feed — it will show up here.'
            : 'Check back later for new posts.'
        ));
        return;
      }
      posts.forEach((p) => content.append(PostCard(p, {
        onDeleted: () => {
          profile.posts = profile.posts.filter((x) => x._id !== p._id);
          profile.user.postsCount = Math.max(0, profile.user.postsCount - 1);
          repaintTabs();
        },
      })));
    } catch (err) {
      const a = Alert('error', err.message, { onDismiss: () => a.remove() });
      if (a) content.append(a);
    }
  };

  const loadUsers = async (which) => {
    content.append(Loader(which === 'followers' ? 'Loading followers...' : 'Loading following...'));
    await delay(220);
    if (!alive()) return;
    content.innerHTML = '';
    try {
      const { users } = which === 'followers'
        ? api.users.followers(profile.user.username, state.me._id)
        : api.users.following(profile.user.username, state.me._id);
      profile.users = users;
      if (users.length === 0) {
        content.append(EmptyState(
          Icons.users(26),
          which === 'followers' ? 'No followers yet' : 'Not following anyone yet',
          profile.isSelf
            ? (which === 'followers'
              ? 'When people follow you, they will appear here.'
              : 'Find interesting people via Search and follow them.')
            : 'Nothing to see here yet.'
        ));
        return;
      }
      users.forEach((usr) => content.append(UserCard(usr, (userId, patch) => {
        const target = users.find((x) => x._id === userId);
        if (target) Object.assign(target, patch);
      })));
    } catch (err) {
      const a = Alert('error', err.message, { onDismiss: () => a.remove() });
      if (a) content.append(a);
    }
  };

  repaintTabs();
  renderTab();
}

/* ============================================================
   PAGES — search
   ============================================================ */
function SearchPage(pageEl, alive, route) {
  pageEl.append(el(`<div class="page-heading">Search users</div>`));

  const searchWrap = el(
    `<div class="input-wrap" style="margin-bottom:18px">
      <span class="input-icon">${Icons.search(17)}</span>
      <input class="input" style="padding:12px 16px 12px 42px;border-radius:var(--r-full)" type="search"
        placeholder="Search by name or @username..." aria-label="Search users by name or username">
    </div>`
  );
  pageEl.append(searchWrap);
  const input = $('input', searchWrap);
  const results = el('<div></div>');
  pageEl.append(results);

  let searched = false;

  const renderResults = (users, q) => {
    results.innerHTML = '';
    if (!searched) {
      results.append(EmptyState(Icons.search(26), 'Find people on Connectify',
        'Type a name or an @username above — results appear instantly as you type.'));
      return;
    }
    if (users.length === 0) {
      results.append(EmptyState(Icons.users(26), `No results for "${q}"`,
        'Double-check the spelling or try a different name or username.'));
      return;
    }
    users.forEach((u) => results.append(UserCard(u, (userId, patch) => {
      // no local list state needed; each UserCard manages its own button
    })));
  };

  input.value = route.query && route.query.get('q') ? route.query.get('q') : '';
  renderResults([], '');
  setTimeout(() => input.focus(), 40);

  const runSearch = async (q) => {
    if (!q) {
      searched = false;
      renderResults([], '');
      try { history.replaceState(null, '', '#/search'); } catch (e) { /* noop */ }
      return;
    }
    results.innerHTML = '';
    results.append(Loader('Searching...'));
    await delay(240);
    if (!alive()) return;
    try {
      const { users } = api.users.search(q, state.me._id);
      searched = true;
      renderResults(users, q);
      try { history.replaceState(null, '', '#/search?q=' + encodeURIComponent(q)); } catch (e) { /* noop */ }
    } catch (err) {
      results.innerHTML = '';
      const a = Alert('error', err.message, { onDismiss: () => a.remove() });
      if (a) results.append(a);
    }
  };

  input.addEventListener('input', debounce(() => runSearch(input.value.trim()), 350));

  // if the navbar search or URL carried a query, run it immediately
  if (input.value.trim()) runSearch(input.value.trim());
}

/* ============================================================
   PAGES — notifications
   ============================================================ */
const NOTIF_TYPE_CONFIG = {
  like: { icon: () => Icons.heart(17, true), cls: 'like', verb: 'liked your post' },
  comment: { icon: () => Icons.comment(17), cls: 'comment', verb: 'commented on your post' },
  follow: { icon: () => Icons.userPlus(17), cls: 'follow', verb: 'started following you' },
};

function NotificationItem(n) {
  const config = NOTIF_TYPE_CONFIG[n.type] || NOTIF_TYPE_CONFIG.like;
  const senderName = (n.sender && n.sender.name) || 'Someone';

  const row = el(
    `<div class="notif-item${n.read ? '' : ' unread'}" role="button" tabindex="0"
        aria-label="${esc(senderName)} ${esc(config.verb)}">
      <div class="notif-icon ${config.cls}">${config.icon()}</div>
      <div class="notif-body">
        <div class="notif-text"><b>${esc(senderName)}</b> ${config.verb}</div>
        ${n.post && n.post.content ? `<div class="notif-snippet">&quot;${esc(truncate(n.post.content, 70))}&quot;</div>` : ''}
        ${n.comment && n.comment.text ? `<div class="notif-snippet">&quot;${esc(truncate(n.comment.text, 70))}&quot;</div>` : ''}
        <div class="notif-time">${timeAgo(n.createdAt)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span data-avatar></span>
        ${!n.read ? '<span class="unread-dot" aria-label="Unread"></span>' : ''}
      </div>
    </div>`
  );
  $('[data-avatar]', row).append(Avatar(n.sender, 'sm'));

  const go = () => {
    if (!n.read) {
      n.read = true;
      try { api.notifications.markRead(n._id, state.me._id); } catch (e) { /* noop */ }
      row.classList.remove('unread');
      const dot = $('.unread-dot', row);
      if (dot) dot.remove();
      window.dispatchEvent(new Event('notifications:changed'));
    }
    if (n.type === 'follow' && n.sender && n.sender.username) {
      navigate('/profile/' + n.sender.username);
    } else if (n.post && n.post._id) {
      navigate('/post/' + n.post._id);
    }
  };
  row.addEventListener('click', go);
  row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });

  return row;
}

async function NotificationsPage(pageEl, alive) {
  const headRow = el(
    `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="page-heading" style="margin:0">Notifications</div>
      <span data-markall style="display:none">
        <button type="button" class="btn btn-soft btn-sm">${Icons.check(15)} Mark all read</button>
      </span>
    </div>`
  );
  pageEl.append(headRow);
  const markAllWrap = $('[data-markall]', headRow);
  const listSlot = el('<div></div>');
  pageEl.append(listSlot);

  let page = 1;
  let hasMore = false;
  let unread = 0;

  const repaintMarkAll = () => { markAllWrap.style.display = unread > 0 ? '' : 'none'; };

  markAllWrap.querySelector('button').addEventListener('click', () => {
    try {
      api.notifications.markAllRead(state.me._id);
      $$('.notif-item', listSlot).forEach((item) => {
        item.classList.remove('unread');
        const dot = $('.unread-dot', item);
        if (dot) dot.remove();
      });
      unread = 0;
      repaintMarkAll();
      window.dispatchEvent(new Event('notifications:changed'));
    } catch (err) { /* storage issue — badge will recover on next poll */ }
  });

  const loadPage = async (nextPage, isRefresh) => {
    if (isRefresh) { listSlot.innerHTML = ''; listSlot.append(Loader('Loading notifications...')); }
    await delay(isRefresh ? 250 : 200);
    if (!alive()) return;
    try {
      const data = api.notifications.list(state.me._id, nextPage, 20);
      unread = data.unreadCount;
      repaintMarkAll();
      if (isRefresh) {
        listSlot.innerHTML = '';
        if (data.notifications.length === 0) {
          const card = el(`<div class="card" style="overflow:hidden;padding:0"></div>`);
          card.append(EmptyState(Icons.bell(26), 'No notifications yet',
            'When someone likes or comments on your posts, or follows you, it will show up here.'));
          listSlot.append(card);
          return;
        }
        listSlot.append(el(`<div class="card" style="overflow:hidden;padding:0" data-list></div>`));
      }
      const listEl = $('[data-list]', listSlot);
      data.notifications.forEach((n) => listEl.append(NotificationItem(n)));
      hasMore = data.hasMore;
      page = data.page;
      const oldMore = $('.center-load', pageEl);
      if (oldMore) oldMore.remove();
      if (hasMore) {
        const wrap = el(`<div class="center-load"><button type="button" class="btn btn-outline">Load more</button></div>`);
        wrap.querySelector('button').addEventListener('click', () => loadPage(page + 1, false));
        pageEl.append(wrap);
      }
    } catch (err) {
      listSlot.innerHTML = '';
      const a = Alert('error', err.message, { onDismiss: () => a.remove() });
      if (a) listSlot.append(a);
    }
  };

  await loadPage(1, true);
}

   PAGES — edit profile
   ============================================================ */
const MAX_BIO_CHARS = 160;

function EditProfilePage(pageEl) {
  const me = state.me;
  pageEl.style.maxWidth = '560px';
  pageEl.append(el(`<div class="page-heading">Edit profile</div>`));

  let avatarData;
  let busy = false;

  const card = el(
    `<div class="card" style="padding:22px">
      <div class="alert-slot" style="display:none"></div>
      <div class="success-slot" style="display:none"></div>
      <form novalidate>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
          <span data-avatar></span>
          <div>
            <button type="button" class="btn btn-soft btn-sm" data-pick>${Icons.camera(15)} Change photo</button>
            <div class="field-hint">JPG, PNG, GIF or WebP — max 5MB</div>
          </div>
        </div>
        <div class="field">
          <label for="p-name">Full name</label>
          <div class="input-wrap"><span class="input-icon">${Icons.user(16)}</span>
            <input id="p-name" class="input" maxlength="50" required></div>
        </div>
        <div class="field">
          <label for="p-username">Username</label>
          <div class="input-wrap"><span class="input-icon">${Icons.user(16)}</span>
            <input id="p-username" class="input" maxlength="20" required></div>
          <div class="field-hint">Changing this updates your @handle and profile URL</div>
        </div>
        <div class="field">
          <label for="p-email">Email</label>
          <div class="input-wrap"><span class="input-icon">${Icons.mail(16)}</span>
            <input id="p-email" class="input" type="email" required></div>
        </div>
        <div class="field">
          <label for="p-bio">Bio</label>
          <textarea id="p-bio" class="textarea" maxlength="${MAX_BIO_CHARS}" rows="3" placeholder="Tell the community about yourself..."></textarea>
          <div class="char-count" data-count></div>
        </div>
        <div class="flex-center" style="justify-content:flex-end;gap:10px">
          <button type="button" class="btn btn-ghost" data-cancel>Cancel</button>
          <button class="btn btn-primary" type="submit">Save changes</button>
        </div>
      </form>
    </div>`
  );
  pageEl.append(card);

  const alertSlot = $('.alert-slot', card);
  const successSlot = $('.success-slot', card);
  const showError = (msg) => {
    alertSlot.innerHTML = '';
    const a = Alert('error', msg, { onDismiss: () => { alertSlot.innerHTML = ''; alertSlot.style.display = 'none'; } });
    if (a) { alertSlot.append(a); alertSlot.style.display = 'block'; }
  };
  const showSuccess = (msg) => {
    successSlot.innerHTML = '';
    const a = Alert('success', msg, { onDismiss: () => { successSlot.innerHTML = ''; successSlot.style.display = 'none'; } });
    if (a) { successSlot.append(a); successSlot.style.display = 'block'; }
  };

  const avatarSlot = $('[data-avatar]', card);
  const paintAvatar = () => {
    avatarSlot.innerHTML = '';
    if (avatarData) {
      const img = el(`<img class="avatar-fallback lg" style="object-fit:cover" alt="New avatar preview">`);
      img.src = avatarData;
      avatarSlot.append(img);
    } else {
      avatarSlot.append(Avatar(me, 'lg'));
    }
  };
  paintAvatar();

  const nameInput = $('#p-name', card);
  const usernameInput = $('#p-username', card);
  const emailInput = $('#p-email', card);
  const bioInput = $('#p-bio', card);
  const countEl = $('[data-count]', card);
  const form = $('form', card);
  const submitBtn = $('button[type=submit]', card);
  const cancelBtn = $('[data-cancel]', card);

  nameInput.value = me.name || '';
  usernameInput.value = me.username || '';
  emailInput.value = me.email || '';
  bioInput.value = me.bio || '';
  const repaintCount = () => { countEl.textContent = String(MAX_BIO_CHARS - bioInput.value.length); };
  bioInput.addEventListener('input', repaintCount);
  repaintCount();

  const fileInput = el(`<input type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>`);
  card.append(fileInput);
  $('[data-pick]', card).addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showError('Avatar image is too large. Maximum size is 5MB.'); return; }
    try {
      avatarData = await fileToDataURL(file, 320, 0.85);
      alertSlot.innerHTML = ''; alertSlot.style.display = 'none';
      paintAvatar();
    } catch (err) {
      showError(err.message);
    }
  });

  cancelBtn.addEventListener('click', () => {
    if (history.length > 1) history.back();
    else navigate('/profile/' + me.username);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy) return;
    alertSlot.innerHTML = ''; alertSlot.style.display = 'none';
    successSlot.innerHTML = ''; successSlot.style.display = 'none';

    const name = nameInput.value.trim();
    const username = usernameInput.value.trim();
    const email = emailInput.value.trim();
    const bio = bioInput.value.trim();

    if (name.length < 2) return showError('Name must be at least 2 characters');
    if (!USERNAME_RE.test(username)) return showError('Username must be 3-20 characters (letters, numbers, underscores)');
    if (!EMAIL_RE.test(email)) return showError('Please enter a valid email');

    busy = true;
    submitBtn.disabled = true;
    cancelBtn.disabled = true;
    submitBtn.innerHTML = `${Spinner('sm', true).outerHTML} Save changes`;
    await delay(350);
    try {
      const patch = { name, username, bio, email };
      if (avatarData) patch.avatar = avatarData;
      const { user } = api.users.updateProfile(me._id, patch);
      state.me = user;
      showSuccess('Profile updated successfully!');
      await delay(700);
      if (busy) navigate('/profile/' + user.username);
    } catch (err) {
      showError(err.message);
      busy = false;
      submitBtn.disabled = false;
      cancelBtn.disabled = false;
      submitBtn.innerHTML = 'Save changes';
    }
  });
}

/* ============================================================
   ROUTER (hash-based — works from file:// with zero setup)
   ============================================================ */
const PUBLIC_ROUTES = ['login', 'register'];

function currentRoute() {
  const raw = (location.hash || '/').replace(/^#/, '');
  const qIdx = raw.indexOf('?');
  const path = qIdx >= 0 ? raw.slice(0, qIdx) : raw;
  const queryStr = qIdx >= 0 ? raw.slice(qIdx + 1) : '';
  const query = new URLSearchParams(queryStr);
  const seg = path.split('/').filter(Boolean);
  const route = { name: 'notFound', path, fullPath: path + (queryStr ? '?' + queryStr : ''), query };

  if (seg.length === 0) route.name = 'feed';
  else if (seg[0] === 'login') route.name = 'login';
  else if (seg[0] === 'register') route.name = 'register';
  else if (seg[0] === 'search') route.name = 'search';
  else if (seg[0] === 'notifications') route.name = 'notifications';
  else if (seg[0] === 'profile' && seg[1]) { route.name = 'profile'; route.username = decodeURIComponent(seg[1]); }
  else if (seg[0] === 'post' && seg[1]) { route.name = 'post'; route.id = seg[1]; }
  else if (seg[0] === 'settings' && seg[1] === 'profile') route.name = 'editProfile';

  return route;
}

function navigate(path, { replace = false } = {}) {
  const target = '#' + path;
  if (location.hash === target || (location.hash === '' && path === '/')) {
    render();
    return;
  }
  if (replace) location.replace(target);
  else location.hash = target;
}

function render() {
  navEpoch += 1;
  const myEpoch = navEpoch;
  const alive = () => myEpoch === navEpoch;
  closeAnyModal();

  const route = currentRoute();
  const app = document.getElementById('app');
  const authed = !!state.me;

  // auth guards (same behaviour as the protected route shell)
  if (!authed && !PUBLIC_ROUTES.includes(route.name)) {
    authRedirect = route.fullPath && route.fullPath !== '/' ? route.fullPath : '/';
    navigate('/login', { replace: true });
    return;
  }
  if (authed && PUBLIC_ROUTES.includes(route.name)) {
    navigate('/', { replace: true });
    return;
  }

  window.scrollTo(0, 0);

  if (route.name === 'login' || route.name === 'register') {
    document.title = 'Connectify — ' + (route.name === 'login' ? 'Log in' : 'Create account');
    app.innerHTML = '';
    app.append(route.name === 'login' ? LoginPage() : RegisterPage());
    return;
  }

  if (route.name === 'notFound' && !authed) {
    document.title = 'Connectify — Page not found';
    app.innerHTML = '';
    app.append(NotFoundStandalone());
    return;
  }

  document.title = 'Connectify — Social Platform';
  app.innerHTML = '';
  app.append(Navbar(route));
  const pageEl = el('<main id="page" class="page page-fade"></main>');
  app.append(pageEl);
  app.append(BottomNav(route));

  switch (route.name) {
    case 'feed': FeedPage(pageEl, alive); break;
    case 'search': SearchPage(pageEl, alive, route); break;
    case 'notifications': NotificationsPage(pageEl, alive); break;
    case 'profile': ProfilePage(pageEl, alive, route.username); break;
    case 'post': PostDetailPage(pageEl, alive, route.id); break;
    case 'editProfile': EditProfilePage(pageEl); break;
    default: NotFoundPage(pageEl);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  db = loadDB();
  if (!db) {
    db = seedDB();
    saveDB();
  }

  const app = document.getElementById('app');
  app.innerHTML = '';
  app.append(el(
    `<div style="min-height:100vh;display:grid;place-items:center">
      <div class="center-load" style="flex-direction:column;gap:10px;align-items:center">
        <span class="spinner lg"></span>
        <span class="muted small">Starting Connectify...</span>
      </div>
    </div>`
  ));

  const sess = getSession();
  if (sess) state.me = api.auth.me(sess);

  // brief splash mirrors the original auth-bootstrap; keeps first paint clean
  setTimeout(() => {
    state.initializing = false;
    if (!location.hash) {
      try { history.replaceState(null, '', '#/'); } catch (e) { /* noop */ }
    }
    render();
    window.addEventListener('hashchange', render);
    window.addEventListener('notifications:changed', refreshUnreadBadge);
  }, 400);
})();
