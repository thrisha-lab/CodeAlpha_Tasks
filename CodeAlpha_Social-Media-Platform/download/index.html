<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connectify — Social Platform</title>
<meta name="description" content="Connectify — a self-contained social media platform demo. Open this file in any modern browser; no server or install required.">

<style>
/* ============================================================
   Connectify — Design System (modern CSS, no framework)
   ============================================================ */
:root {
  --bg: #f1f3f7;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e5e9f0;
  --border-strong: #d5dbe4;
  --text: #101828;
  --text-2: #5b6472;
  --text-3: #98a2b3;

  --primary: #7c3aed;
  --primary-strong: #6d28d9;
  --primary-soft: #f3eefe;
  --primary-ring: rgba(124, 58, 237, 0.25);
  --gradient: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);

  --danger: #e5484d;
  --danger-soft: #feecec;
  --success: #12b76a;
  --warning: #f79009;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;
  --r-full: 999px;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
  --shadow-md: 0 4px 14px rgba(16, 24, 40, 0.08);
  --shadow-lg: 0 12px 34px rgba(16, 24, 40, 0.14);

  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
    'Noto Sans', sans-serif;

  --nav-h: 62px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#app { min-height: 100vh; }
#root { min-height: 100vh; }

a { color: inherit; text-decoration: none; }
a:hover { text-decoration: none; }

img { display: block; max-width: 100%; }

button {
  font-family: inherit;
  font-size: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
  padding: 0;
}

input, textarea { font-family: inherit; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #cdd4de; border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-weight: 600;
  font-size: 14px;
  border-radius: var(--r-full);
  padding: 9px 18px;
  transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease,
    color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn .spinner { flex-shrink: 0; }

.btn-primary {
  background: var(--gradient);
  color: #fff;
  box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
}
.btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45); filter: brightness(1.05); }

.btn-outline { border: 1.5px solid var(--border-strong); color: var(--text); background: var(--surface); }
.btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

.btn-soft { background: var(--primary-soft); color: var(--primary); }
.btn-soft:hover:not(:disabled) { background: #ebe2fd; }

.btn-ghost { color: var(--text-2); }
.btn-ghost:hover:not(:disabled) { background: rgba(16, 24, 40, 0.06); color: var(--text); }

.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(1.06); }

.btn-danger-soft { background: var(--danger-soft); color: var(--danger); }
.btn-danger-soft:hover:not(:disabled) { background: #fdddd0; }

.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-lg { padding: 12px 24px; font-size: 15px; }
.btn-block { width: 100%; }

.btn-icon {
  padding: 8px;
  border-radius: var(--r-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
}
.btn-icon:hover { background: rgba(16, 24, 40, 0.06); color: var(--text); }
.btn-icon:active { transform: scale(0.92); }

/* ============ Forms ============ */
.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; color: var(--text); }

.input, .textarea {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border-strong);
  border-radius: var(--r-md);
  padding: 10px 14px;
  font-size: 14.5px;
  color: var(--text);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input::placeholder, .textarea::placeholder { color: var(--text-3); }
.input:focus, .textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px var(--primary-ring);
}
.input.invalid, .textarea.invalid { border-color: var(--danger); }
.input.invalid:focus { box-shadow: 0 0 0 4px rgba(229, 72, 77, 0.15); }

.textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

.field-hint { font-size: 12.5px; color: var(--text-3); margin-top: 5px; }
.field-error { font-size: 13px; color: var(--danger); margin-top: 5px; }
.char-count { font-size: 12px; color: var(--text-3); text-align: right; margin-top: 4px; }
.char-count.over { color: var(--danger); font-weight: 600; }

.input-wrap { position: relative; }
.input-wrap .input { padding-left: 40px; }
.input-wrap .input-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; display: flex; }

/* ============ Cards / layout ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}

.page {
  max-width: 620px;
  margin: 0 auto;
  padding: 22px 16px 90px;
}
.page-wide { max-width: 860px; }
.page-heading { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 18px; }

/* ============ Navbar ============ */
.navbar {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--nav-h);
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.navbar-inner {
  max-width: 1100px;
  margin: 0 auto;
  height: 100%;
  padding: 0 18px;
  display: flex;
  align-items: center;
  gap: 18px;
}

.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -0.03em; }
.brand-logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--gradient);
  display: flex; align-items: center; justify-content: center;
  color: #fff; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.4);
  flex-shrink: 0;
}

.nav-search { flex: 1; max-width: 420px; }
.nav-search .input { padding: 8px 14px 8px 38px; border-radius: var(--r-full); background: var(--surface-2); border-color: var(--border); }
.nav-search .input:focus { background: var(--surface); }

.nav-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }

.nav-link {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px;
  border-radius: var(--r-full);
  color: var(--text-2);
  transition: background 0.15s ease, color 0.15s ease;
}
.nav-link:hover { background: rgba(16, 24, 40, 0.06); color: var(--text); }
.nav-link.active { color: var(--primary); background: var(--primary-soft); }

.nav-badge {
  position: absolute; top: 4px; right: 4px;
  min-width: 17px; height: 17px; padding: 0 4px;
  background: var(--danger); color: #fff;
  border-radius: var(--r-full);
  font-size: 10.5px; font-weight: 700; line-height: 17px; text-align: center;
  border: 2px solid var(--surface);
}

.nav-avatar-btn { width: 40px; height: 40px; padding: 3px; border-radius: var(--r-full); }
.nav-avatar-btn:hover { background: rgba(16, 24, 40, 0.06); }
.nav-avatar-btn .avatar, .nav-avatar-btn .avatar-fallback { width: 32px; height: 32px; font-size: 12px; }

/* Dropdown menu */
.menu-anchor { position: relative; }
.menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 210px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  z-index: 60;
  animation: menuIn 0.14s ease;
}
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }
.menu-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border-radius: var(--r-sm);
  font-size: 14px; font-weight: 500;
  color: var(--text);
  text-align: left;
}
.menu-item:hover { background: var(--surface-2); }
.menu-item.danger { color: var(--danger); }
.menu-item.danger:hover { background: var(--danger-soft); }
.menu-header { padding: 9px 12px 7px; border-bottom: 1px solid var(--border); margin-bottom: 5px; }
.menu-header .name { font-weight: 700; font-size: 14px; }
.menu-header .username { font-size: 12.5px; color: var(--text-3); }
.menu-divider { height: 1px; background: var(--border); margin: 5px 0; }

/* ============ Bottom nav (mobile) ============ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 50;
  display: none;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav-inner { display: grid; grid-template-columns: repeat(4, 1fr); }
.bottom-nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 56px; gap: 2px;
  color: var(--text-3);
  font-size: 10.5px; font-weight: 600;
  position: relative;
}
.bottom-nav-item.active { color: var(--primary); }

/* ============ Avatars ============ */
.avatar {
  border-radius: var(--r-full);
  object-fit: cover;
  background: var(--surface-2);
  flex-shrink: 0;
}
.avatar-fallback {
  border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700;
  flex-shrink: 0;
  user-select: none;
  letter-spacing: 0.02em;
}
.avatar-sm, .avatar-fallback.sm { width: 34px; height: 34px; font-size: 13px; }
.avatar-md, .avatar-fallback.md { width: 42px; height: 42px; font-size: 15px; }
.avatar-lg, .avatar-fallback.lg { width: 84px; height: 84px; font-size: 28px; }
.avatar-xl, .avatar-fallback.xl { width: 96px; height: 96px; font-size: 32px; }
.avatar-ring { border: 3px solid #fff; box-shadow: var(--shadow-md); }

.username-link { font-weight: 700; }
.username-link:hover { text-decoration: underline; }
.handle { color: var(--text-3); font-size: 13.5px; }
.handle-link:hover { color: var(--primary); }

/* ============ Composer ============ */
.composer { padding: 16px 18px; margin-bottom: 18px; }
.composer-row { display: flex; gap: 12px; }
.composer-main { flex: 1; }
.composer .textarea {
  border: none; padding: 6px 2px 10px; min-height: 60px; font-size: 15.5px;
  box-shadow: none !important;
}
.composer .textarea:focus { outline: none; }
.composer-footer {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); padding-top: 12px;
}
.composer-tools { display: flex; align-items: center; gap: 2px; color: var(--primary); }
.composer-tools .btn-icon { color: var(--primary); }
.image-preview { position: relative; margin-top: 10px; border-radius: var(--r-md); overflow: hidden; }
.image-preview img { width: 100%; max-height: 260px; object-fit: cover; }
.image-preview .remove {
  position: absolute; top: 8px; right: 8px;
  background: rgba(16, 24, 40, 0.65); color: #fff;
  border-radius: var(--r-full); padding: 6px; display: flex;
  backdrop-filter: blur(4px);
}
.image-preview .remove:hover { background: rgba(16, 24, 40, 0.85); }

/* ============ Post card ============ */
.post-card { padding: 16px 18px 10px; margin-bottom: 14px; transition: box-shadow 0.15s ease, border-color 0.15s ease; }
.post-card:hover { box-shadow: var(--shadow-md); }
.post-header { display: flex; align-items: flex-start; gap: 12px; }
.post-header .who { flex: 1; min-width: 0; }
.post-header .name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.post-header .time { color: var(--text-3); font-size: 13px; }
.post-content {
  margin: 10px 0 0 54px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 15px;
  color: var(--text);
}
.post-image {
  margin: 12px 0 0 54px;
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--border);
}
.post-image img { width: 100%; max-height: 420px; object-fit: cover; cursor: zoom-in; }
.post-actions {
  display: flex; align-items: center; gap: 6px;
  margin: 8px 0 0 42px;
}
.action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-3);
  font-size: 13.5px; font-weight: 600;
  padding: 7px 12px;
  border-radius: var(--r-full);
  transition: background 0.15s ease, color 0.15s ease;
}
.action-btn:hover { background: rgba(16, 24, 40, 0.05); }
.action-btn.like:hover { color: var(--danger); background: var(--danger-soft); }
.action-btn.like.liked { color: var(--danger); }
.action-btn.like.liked svg { animation: heartPop 0.32s ease; }
.action-btn.comment:hover { color: var(--primary); background: var(--primary-soft); }
@keyframes heartPop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

.post-menu-wrap { position: relative; flex-shrink: 0; }

/* ============ Comments ============ */
.comments {
  margin: 10px 0 6px 54px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.comment { display: flex; gap: 10px; padding: 7px 0; }
.comment-bubble {
  background: var(--surface-2);
  border-radius: 14px;
  padding: 8px 13px;
  font-size: 14px;
  max-width: 100%;
  word-break: break-word;
}
.comment-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; padding-left: 4px; font-size: 12.5px; color: var(--text-3); }
.comment-meta button { color: var(--text-3); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
.comment-meta button:hover { color: var(--danger); }
.comment-form { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.comment-form .input { border-radius: var(--r-full); padding: 8px 16px; background: var(--surface-2); }
.send-btn {
  width: 38px; height: 38px; border-radius: var(--r-full);
  background: var(--gradient); color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(139, 92, 246, 0.35);
  transition: transform 0.1s ease, opacity 0.15s ease;
}
.send-btn:hover:not(:disabled) { filter: brightness(1.06); }
.send-btn:disabled { opacity: 0.5; }
.send-btn:active:not(:disabled) { transform: scale(0.92); }

/* ============ Profile ============ */
.profile-card { overflow: hidden; margin-bottom: 16px; }
.profile-banner { height: 130px; background: var(--gradient); position: relative; }
.profile-banner::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at top right, rgba(255,255,255,0.25), transparent 55%);
}
.profile-head { padding: 0 22px 20px; position: relative; }
.profile-head .avatar, .profile-head .avatar-fallback { position: absolute; top: -44px; left: 22px; }
.profile-toprow { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; min-height: 54px; }
.profile-id { margin-top: 4px; }
.profile-id h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
.profile-id .handle { font-size: 14.5px; }
.profile-bio { margin: 8px 0 10px; color: var(--text); white-space: pre-wrap; }
.profile-joined { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 13.5px; }

.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; background: transparent; }
.tab {
  flex: 1;
  padding: 12px 8px;
  text-align: center;
  font-weight: 600; font-size: 14px;
  color: var(--text-3);
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s ease, border-color 0.15s ease;
  border-radius: 0;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ============ User cards / lists ============ */
.user-card {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px;
  margin-bottom: 10px;
  transition: box-shadow 0.15s ease;
}
.user-card:hover { box-shadow: var(--shadow-md); }
.user-card .info { flex: 1; min-width: 0; }
.user-card .name { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 5px; }
.user-card .handle { font-size: 13px; }
.user-card .bio {
  font-size: 13px; color: var(--text-2); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ============ Notifications ============ */
.notif-item {
  display: flex; gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s ease;
  cursor: pointer;
  align-items: flex-start;
}
.notif-item:last-child { border-bottom: none; }
.notif-item:hover { background: var(--surface-2); }
.notif-item.unread { background: var(--primary-soft); }
.notif-item.unread:hover { background: #ece3fd; }
.notif-icon {
  width: 38px; height: 38px; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: #fff;
}
.notif-icon.like { background: var(--gradient); }
.notif-icon.comment { background: #12b7a2; }
.notif-icon.follow { background: #f79009; }
.notif-body { flex: 1; min-width: 0; }
.notif-text { font-size: 14px; }
.notif-text b { font-weight: 700; }
.notif-snippet {
  font-size: 13px; color: var(--text-2); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.notif-time { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
.unread-dot { width: 8px; height: 8px; border-radius: var(--r-full); background: var(--primary); margin-top: 14px; flex-shrink: 0; }

/* ============ Auth pages ============ */
.auth-shell { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.auth-hero {
  background: var(--gradient);
  color: #fff;
  padding: 48px;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden;
}
.auth-hero::before {
  content: ''; position: absolute; width: 480px; height: 480px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.09); top: -160px; right: -140px;
}
.auth-hero::after {
  content: ''; position: absolute; width: 320px; height: 320px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.08); bottom: -110px; left: -90px;
}
.auth-hero .brand-logo { width: 46px; height: 46px; border-radius: 13px; background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); }
.auth-hero h1 { font-size: 30px; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 12px; max-width: 400px; position: relative; z-index: 1; }
.auth-hero p { color: rgba(255, 255, 255, 0.85); max-width: 400px; position: relative; z-index: 1; }
.auth-points { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 12px; position: relative; z-index: 1; }
.auth-points li { display: flex; gap: 10px; align-items: center; font-weight: 500; font-size: 14.5px; color: rgba(255,255,255,0.95); }
.auth-points .pt-icon { width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.auth-form-side { display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.auth-card { width: 100%; max-width: 400px; }
.auth-card h2 { font-size: 24px; letter-spacing: -0.02em; margin: 0 0 4px; }
.auth-card .sub { color: var(--text-2); margin: 0 0 22px; font-size: 14.5px; }
.auth-alt { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-2); }

}

  if (seconds < 45) return 'just now';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `${days}d ago`;
  return new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};

const formatJoined = (date) =>

};

  try {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    return true;
  } catch (e) {
    storageAvailable = false;
    return false;
  }
}

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== 1 || !Array.isArray(parsed.users)) return null;
    return parsed;
  } catch (e) {
    return null;

}

  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* noop */ }

function seedDB() {
  const users = seedUsersData.map((u, i) => ({
    _id: 'u' + (i + 1),
    name: u.name,
    username: u.username,
    email: u.email,
    passwordHash: hashPassword(u.password),
    bio: u.bio,
    avatar: u.avatar,
    createdAt: daysAgo(120 - i * 9).toISOString(),
  }));
  const userByName = {};
  users.forEach((u) => { userByName[u.username] = u; });

  const posts = seedPostsData.map((p, i) => ({
    _id: 'p' + (i + 1),
    authorId: userByName[p.author]._id,
    content: p.content,
    image: p.image || '',
    createdAt: p.createdAt.toISOString(),
    updatedAt: p.createdAt.toISOString(),
  }));

  const postId = (i) => 'p' + (i + 1);

  // follows + notifications (older half already read, like the seeder)
  const follows = [];
  const notifications = [];
  let nSeq = 0;
  const pushNotif = (n) => { notifications.push(n); };
  seedFollowsGraph.forEach(([follower, following], idx) => {
    follows.push({
      _id: 'f' + (idx + 1),
      followerId: userByName[follower]._id,
      followingId: userByName[following]._id,
      createdAt: minutesAgo(600 - idx * 8).toISOString(),
    });
    pushNotif({
      _id: 'n' + (++nSeq),
      recipientId: userByName[following]._id,
      senderId: userByName[follower]._id,
      type: 'follow',
      postId: null,
      commentId: null,
      read: idx < seedFollowsGraph.length / 2,
      createdAt: minutesAgo(600 - idx * 8).toISOString(),
    });
  });

  // likes + notifications (self-likes skipped, exactly like the seeder)
  const likes = [];
  seedLikesGraph.forEach(([username, postIdx], i) => {
    const created = minutesAgo(560 - i * 9).toISOString();
    likes.push({ _id: 'l' + (i + 1), userId: userByName[username]._id, postId: postId(postIdx), createdAt: created });
    const postAuthor = seedPostsData[postIdx].author;
    if (postAuthor !== username) {
      pushNotif({
        _id: 'n' + (++nSeq),
        recipientId: userByName[postAuthor]._id,
        senderId: userByName[username]._id,
        type: 'like',
        postId: postId(postIdx),
        commentId: null,
        read: i < seedLikesGraph.length / 2,
        createdAt: created,
      });
    }
  });

  // comments + notifications
  const comments = [];
  seedCommentsGraph.forEach((c, i) => {
    const created = minutesAgo(430 - i * 11).toISOString();
    const commentId = 'c' + (i + 1);
    comments.push({ _id: commentId, postId: postId(c.post), authorId: userByName[c.author]._id, text: c.text, createdAt: created });
    const postAuthor = seedPostsData[c.post].author;
    if (postAuthor !== c.author) {
      pushNotif({
        _id: 'n' + (++nSeq),
        recipientId: userByName[postAuthor]._id,
        senderId: userByName[c.author]._id,
        type: 'comment',
        postId: postId(c.post),
        commentId,
        read: i < seedCommentsGraph.length / 2,
        createdAt: created,
      });
    }
  });

  // sort notifications newest-first once (list endpoints rely on it)
  notifications.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  return { v: 1, users, posts, comments, likes, follows, notifications };
}

/* ---------- lookups & view builders ---------- */
const findUserById = (id) => db.users.find((u) => u._id === id) || null;
const findUserByUsername = (username) =>
  db.users.find((u) => u.username === String(username || '').toLowerCase()) || null;
const findPostById = (id) => db.posts.find((p) => p._id === id) || null;

function socialCounts(userId) {
  return {
    followersCount: db.follows.filter((f) => f.followingId === userId).length,
    followingCount: db.follows.filter((f) => f.followerId === userId).length,
    postsCount: db.posts.filter((p) => p.authorId === userId).length,
  };
}

/** Public shape of a user (passwordHash never leaves the store). */
function userView(u, viewerId) {
  if (!u) return null;
  const counts = socialCounts(u._id);
  return {
    _id: u._id,
    name: u.name,
    username: u.username,
    email: u.email,
    bio: u.bio || '',
    avatar: u.avatar || '',
    createdAt: u.createdAt,
    ...counts,
    isFollowing: viewerId && viewerId !== u._id
      ? db.follows.some((f) => f.followerId === viewerId && f.followingId === u._id)
      : false,
    isSelf: viewerId === u._id,
  };
}

/** Author card used inside posts/comments (server populates only these fields). */
function authorLite(userId) {
  const u = findUserById(userId);
  return u ? { _id: u._id, name: u.name, username: u.username, avatar: u.avatar || '' } : null;
}

function postView(p, viewerId) {
  return {
    _id: p._id,
    author: authorLite(p.authorId),
    content: p.content,
    image: p.image || '',
    likeCount: db.likes.filter((l) => l.postId === p._id).length,
    commentCount: db.comments.filter((c) => c.postId === p._id).length,
    likedByMe: !!viewerId && db.likes.some((l) => l.userId === viewerId && l.postId === p._id),
    createdAt: p.createdAt,
    updatedAt: p.updatedAt,
  };
}

function commentView(c) {
  return {
    _id: c._id,
    post: c.postId,
    author: authorLite(c.authorId),
    text: c.text,
    createdAt: c.createdAt,
  };
}

function notificationView(n) {
  const post = n.postId ? findPostById(n.postId) : null;
  const comment = n.commentId ? db.comments.find((c) => c._id === n.commentId) : null;
  return {
    _id: n._id,
    type: n.type,
    read: !!n.read,
    createdAt: n.createdAt,
    sender: authorLite(n.senderId),
    post: post ? { _id: post._id, content: post.content, image: post.image || '' } : null,
    comment: comment ? { _id: comment._id, text: comment.text } : null,
  };
}

/* ---------- notifications helpers (mirrors notificationService.js) ---------- */
function createNotification({ recipientId, senderId, type, postId = null, commentId = null }) {
  if (!recipientId || !senderId || recipientId === senderId) return; // self-actions never notify
  db.notifications.unshift({
    _id: uid('n'),
    recipientId,
    senderId,
    type,
    postId,
    commentId,
    read: false,
    createdAt: new Date().toISOString(),
  });
}

function deleteNotification({ recipientId, senderId, type, postId = null, commentId = null }) {
  db.notifications = db.notifications.filter((n) => !(
    n.recipientId === recipientId &&
    n.senderId === senderId &&
    n.type === type &&
    (postId === null || n.postId === postId) &&
    (commentId === null || n.commentId === commentId)
  ));
}
/* ============================================================
   API LAYER — same routes/behaviours/error messages as the
   Express controllers, executed against the local store.
   ============================================================ */
function apiError(message, status = 400) {
  const err = new Error(message);
  err.status = status;
  return err;
}

const api = {
  /* ------------------------- auth ------------------------- */
  auth: {
    register({ name, username, email, password }) {
      name = String(name || '').trim();
      username = String(username || '').trim();
      email = String(email || '').trim().toLowerCase();
      password = String(password || '');

      if (!name) throw apiError('Name is required');
      if (name.length < 2 || name.length > 50) throw apiError('Name must be between 2 and 50 characters');
      if (!username) throw apiError('Username is required');
      if (!USERNAME_RE.test(username)) throw apiError('Username must be 3-20 characters and contain only letters, numbers and underscores');
      if (!email) throw apiError('Email is required');
      if (!EMAIL_RE.test(email)) throw apiError('Please provide a valid email address');
      if (!password) throw apiError('Password is required');
      if (password.length < 6) throw apiError('Password must be at least 6 characters long');
      if (password.length > 72) throw apiError('Password must be at most 72 characters long');

      username = username.toLowerCase();
      if (db.users.some((u) => u.username === username)) throw apiError(`Username "${username}" is already taken`, 409);
      if (db.users.some((u) => u.email === email)) throw apiError(`Email "${email}" is already registered`, 409);

      const user = {
        _id: uid('u'),
        name,
        username,
        email,
        passwordHash: hashPassword(password),
        bio: '',
        avatar: '',
        createdAt: new Date().toISOString(),
      };
      db.users.push(user);
      if (!saveDB()) { db.users.pop(); throw apiError('Browser storage is unavailable — account cannot be saved.', 500); }
      return { user: userView(user, user._id), message: 'Account created successfully. Welcome to Connectify!' };
    },

    login({ email, password }) {
      const identifier = String(email || '').trim().toLowerCase();
      if (!identifier) throw apiError('Email or username is required');
      if (!password) throw apiError('Password is required');
      const user = db.users.find((u) => u.email === identifier || u.username === identifier);
      if (!user || user.passwordHash !== hashPassword(password)) {
        throw apiError('Invalid credentials. Please check your email/username and password', 401);
      }
      return { user: userView(user, user._id), message: `Welcome back, ${user.name}!` };
    },

    me(userId) {
      const user = userId ? findUserById(userId) : null;
      return user ? userView(user, user._id) : null;
    },
  },

  /* ------------------------- users ------------------------- */
  users: {
    profile(username, viewerId) {
      const user = findUserByUsername(username);
      if (!user) throw apiError('User not found', 404);
      return { user: userView(user, viewerId) };
    },

    posts(username, viewerId) {
      const user = findUserByUsername(username);
      if (!user) throw apiError('User not found', 404);
      const posts = db.posts
        .filter((p) => p.authorId === user._id)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .map((p) => postView(p, viewerId));
      return { posts, total: posts.length };
    },

    followers(username, viewerId) {
      const user = findUserByUsername(username);
      if (!user) throw apiError('User not found', 404);
      const users = db.follows
        .filter((f) => f.followingId === user._id)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .map((f) => userView(findUserById(f.followerId), viewerId))
        .filter(Boolean);
      return { users, total: users.length };
    },

    following(username, viewerId) {
      const user = findUserByUsername(username);
      if (!user) throw apiError('User not found', 404);
      const users = db.follows
        .filter((f) => f.followerId === user._id)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .map((f) => userView(findUserById(f.followingId), viewerId))
        .filter(Boolean);
      return { users, total: users.length };
    },

    search(q, viewerId) {
      const query = String(q || '').trim();
      if (!query) return { users: [] };
      const needle = query.toLowerCase();
      const users = db.users
        .filter((u) => u.username.toLowerCase().includes(needle) || u.name.toLowerCase().includes(needle))
        .sort((a, b) => {
          const ca = socialCounts(a._id).followersCount;
          const cb = socialCounts(b._id).followersCount;
          return cb - ca || a.name.localeCompare(b.name);
        })
        .slice(0, 10)
        .map((u) => userView(u, viewerId));
      return { users };
    },

    updateProfile(viewerId, patch) {
      const user = findUserById(viewerId);
      if (!user) throw apiError('User not found', 404);
      const clean = {};
      if (patch.name !== undefined) {
        clean.name = String(patch.name).trim();
        if (clean.name.length < 2 || clean.name.length > 50) throw apiError('Name must be between 2 and 50 characters');
      }
      if (patch.username !== undefined) {
        clean.username = String(patch.username).trim().toLowerCase();
        if (!USERNAME_RE.test(clean.username)) throw apiError('Username must be 3-20 characters and contain only letters, numbers and underscores');
      }
      if (patch.bio !== undefined) {
        clean.bio = String(patch.bio).trim();
        if (clean.bio.length > 160) throw apiError('Bio must be at most 160 characters');
      }
      if (patch.email !== undefined) {
        clean.email = String(patch.email).trim().toLowerCase();
        if (!EMAIL_RE.test(clean.email)) throw apiError('Please provide a valid email address');
      }
      if (clean.username && clean.username !== user.username) {
        if (db.users.some((u) => u.username === clean.username)) throw apiError(`Username "${clean.username}" is already taken`, 409);
      }
      if (clean.email && clean.email !== user.email) {
        if (db.users.some((u) => u.email === clean.email)) throw apiError(`Email "${clean.email}" is already registered`, 409);
      }
      if (patch.avatar !== undefined) clean.avatar = patch.avatar;
      Object.assign(user, clean);
      saveDB();
      return { user: userView(user, viewerId), message: 'Profile updated successfully' };
    },
  },

  /* ------------------------- posts ------------------------- */
  posts: {
    feed(viewerId, page = 1, limit = 10) {
      page = Math.max(parseInt(page, 10) || 1, 1);
      limit = Math.min(Math.max(parseInt(limit, 10) || 10, 1), 50);
      const sorted = [...db.posts].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const slice = sorted.slice((page - 1) * limit, page * limit);
      return {
        posts: slice.map((p) => postView(p, viewerId)),
        page,
        total: sorted.length,
        hasMore: page * limit < sorted.length,
      };
    },

    get(id, viewerId) {
      const post = findPostById(id);
      if (!post) throw apiError('Post not found', 404);
      return { post: postView(post, viewerId) };
    },

    create(viewerId, content, image = '') {
      const text = String(content || '').trim();
      if (!text) throw apiError('Post content cannot be empty');
      if (text.length > 1000) throw apiError('Post cannot exceed 1000 characters');
      const now = new Date().toISOString();
      const post = { _id: uid('p'), authorId: viewerId, content: text, image, createdAt: now, updatedAt: now };
      db.posts.push(post);
      if (!saveDB()) {
        // Storage full — retry once without the image before failing.
        if (image) {
          post.image = '';
          if (saveDB()) return { post: postView(post, viewerId), message: 'Post created, but the image was dropped — browser storage is full.', warning: true };
        }
        db.posts.pop();
        throw apiError('Browser storage is full — the post could not be saved. Try a smaller image or remove old data.', 500);
      }
      return { post: postView(post, viewerId), message: 'Post created successfully' };
    },

    update(postId, viewerId, content) {
      const post = findPostById(postId);
      if (!post) throw apiError('Post not found', 404);
      if (post.authorId !== viewerId) throw apiError('You are not allowed to edit this post', 403);
      const text = String(content || '').trim();
      if (!text) throw apiError('Post content cannot be empty');
      if (text.length > 1000) throw apiError('Post cannot exceed 1000 characters');
      post.content = text;
      post.updatedAt = new Date().toISOString();
      saveDB();
      return { post: postView(post, viewerId), message: 'Post updated successfully' };
    },

    remove(postId, viewerId) {
      const post = findPostById(postId);
      if (!post) throw apiError('Post not found', 404);
      if (post.authorId !== viewerId) throw apiError('You are not allowed to delete this post', 403);
      db.likes = db.likes.filter((l) => l.postId !== postId);
      db.comments = db.comments.filter((c) => c.postId !== postId);
      db.notifications = db.notifications.filter((n) => n.postId !== postId);
      db.posts = db.posts.filter((p) => p._id !== postId);
      saveDB();
      return { message: 'Post deleted successfully' };
    },

    like(postId, viewerId) {
      const post = findPostById(postId);
      if (!post) throw apiError('Post not found', 404);
      if (db.likes.some((l) => l.userId === viewerId && l.postId === postId)) {
        return { liked: true, likeCount: db.likes.filter((l) => l.postId === postId).length, message: 'Post already liked' };
      }
      db.likes.push({ _id: uid('l'), userId: viewerId, postId, createdAt: new Date().toISOString() });
      createNotification({ recipientId: post.authorId, senderId: viewerId, type: 'like', postId });
      saveDB();
      return { liked: true, likeCount: db.likes.filter((l) => l.postId === postId).length, message: 'Post liked' };
    },

    unlike(postId, viewerId) {
      const post = findPostById(postId);
      if (!post) throw apiError('Post not found', 404);
      const before = db.likes.length;
      db.likes = db.likes.filter((l) => !(l.userId === viewerId && l.postId === postId));
      if (db.likes.length < before) {
        deleteNotification({ recipientId: post.authorId, senderId: viewerId, type: 'like', postId });
      }
      saveDB();
      return { liked: false, likeCount: db.likes.filter((l) => l.postId === postId).length, message: 'Post unliked' };
    },
  },

  /* ------------------------- comments ------------------------- */
  comments: {
    forPost(postId) {
      if (!findPostById(postId)) throw apiError('Post not found', 404);
      const comments = db.comments
        .filter((c) => c.postId === postId)
        .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)) // conversation order
        .map(commentView);
      return { comments, total: comments.length };
    },

    create(postId, viewerId, text) {
      const value = String(text || '').trim();
      if (!value) throw apiError('Comment cannot be empty');
      if (value.length > 300) throw apiError('Comment cannot exceed 300 characters');
      const post = findPostById(postId);
      if (!post) throw apiError('Post not found', 404);
      const comment = { _id: uid('c'), postId, authorId: viewerId, text: value, createdAt: new Date().toISOString() };
      db.comments.push(comment);
      createNotification({ recipientId: post.authorId, senderId: viewerId, type: 'comment', postId, commentId: comment._id });
      saveDB();
      return { comment: commentView(comment), message: 'Comment added successfully' };
    },

    remove(commentId, viewerId) {
      const comment = db.comments.find((c) => c._id === commentId);
      if (!comment) throw apiError('Comment not found', 404);
      if (comment.authorId !== viewerId) throw apiError('You can only delete your own comments', 403);
      db.comments = db.comments.filter((c) => c._id !== commentId);
      db.notifications = db.notifications.filter((n) => n.commentId !== commentId);
      saveDB();
      return { message: 'Comment deleted successfully' };
    },
  },

  /* ------------------------- follows ------------------------- */
  follows: {
    follow(viewerId, targetId) {
      if (targetId === viewerId) throw apiError('You cannot follow yourself');
      const target = findUserById(targetId);
      if (!target) throw apiError('User not found', 404);
      if (db.follows.some((f) => f.followerId === viewerId && f.followingId === targetId)) {
        throw apiError('You are already following this user', 409);
      }
      db.follows.push({ _id: uid('f'), followerId: viewerId, followingId: targetId, createdAt: new Date().toISOString() });
      createNotification({ recipientId: targetId, senderId: viewerId, type: 'follow' });
      saveDB();
      return {
        following: true,
        followersCount: db.follows.filter((f) => f.followingId === targetId).length,
        message: `You are now following @${target.username}`,
      };
    },

    unfollow(viewerId, targetId) {
      const target = findUserById(targetId);
      if (!target) throw apiError('User not found', 404);
      const before = db.follows.length;
      db.follows = db.follows.filter((f) => !(f.followerId === viewerId && f.followingId === targetId));
      if (db.follows.length === before) throw apiError('You are not following this user', 404);
      deleteNotification({ recipientId: targetId, senderId: viewerId, type: 'follow' });
      saveDB();
      return {
        following: false,
        followersCount: db.follows.filter((f) => f.followingId === targetId).length,
        message: `Unfollowed @${target.username}`,
      };
    },
  },

  /* ------------------------- notifications ------------------------- */
  notifications: {
    list(userId, page = 1, limit = 20) {
      page = Math.max(parseInt(page, 10) || 1, 1);
      limit = Math.min(Math.max(parseInt(limit, 10) || 20, 1), 50);
      const all = db.notifications
        .filter((n) => n.recipientId === userId)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const slice = all.slice((page - 1) * limit, page * limit);
      return {
        notifications: slice.map(notificationView),
        unreadCount: all.filter((n) => !n.read).length,
        page,
        total: all.length,
        hasMore: page * limit < all.length,
      };
    },

    unreadCount(userId) {
      return db.notifications.filter((n) => n.recipientId === userId && !n.read).length;
    },

    markRead(id, userId) {
      const n = db.notifications.find((x) => x._id === id && x.recipientId === userId);
      if (!n) throw apiError('Notification not found', 404);
      n.read = true;
      saveDB();
      return { message: 'Notification marked as read' };
    },

    markAllRead(userId) {
      let updated = 0;
      db.notifications.forEach((n) => {
        if (n.recipientId === userId && !n.read) { n.read = true; updated += 1; }
      });
      saveDB();
      return { updated, message: 'All notifications marked as read' };
    },
  },
};

/** Refresh the navbar unread badge (no full re-render needed). */
function refreshUnreadBadge() {
  const badge = $('#nav-unread-badge');
  if (!badge || !state.me) return;
  const unread = api.notifications.unreadCount(state.me._id);
  if (unread > 0) {
    badge.textContent = unread > 99 ? '99+' : String(unread);
    badge.hidden = false;
  } else {
    badge.hidden = true;
  }
}

/** Avatar with graceful fallback: image when available, colored initials otherwise. */
function Avatar(user, size = 'md', { ring = false, alt = '' } = {}) {
  const hue = hueFromString(user?.username || user?.name || 'user');
  const initials = esc(getInitials(user?.name));
  const fallback = () => el(
    `<div class="avatar-fallback ${size}" role="img" aria-label="${esc(alt || (user?.name || 'user') + "'s avatar")}" style="background:linear-gradient(135deg, hsl(${hue}, 72%, 58%), hsl(${(hue + 40) % 360}, 68%, 46%))">${initials}</div>`
  );
  if (user && user.avatar) {
    const img = el(
      `<img class="avatar avatar-${size}${ring ? ' avatar-ring' : ''}" src="${esc(user.avatar)}" alt="${esc(alt || (user?.name || 'user') + "'s avatar")}" loading="lazy">`
    );
    img.addEventListener('error', () => img.replaceWith(fallback()));
    return img;
  }
  const fb = fallback();
  if (ring) fb.classList.add('avatar-ring');
  return fb;
}

/** Inline error/success banner. Returns null when message is empty. */
function Alert(type = 'error', message = '', { onDismiss } = {}) {
  if (!message) return null;
  const node = el(
    `<div class="alert ${type}" role="${type === 'error' ? 'alert' : 'status'}">

      ${onDismiss ? '<button type="button" aria-label="Dismiss" style="font-weight:700;line-height:1">&times;</button>' : ''}

  );
  const btn = node.querySelector('button');
  if (btn) btn.addEventListener('click', () => { node.remove(); onDismiss && onDismiss(); });
  return node;
}

/* ---------------- modal manager ---------------- */
let activeModal = null;

/**
 * Accessible modal with overlay, Escape-to-close and scroll lock.
 * bodyBuilder/footerBuilder receive the container elements to fill.
 */
function openModal({ title, bodyBuilder, footerBuilder, onClose, dismissable = true }) {
  const overlay = el(
    `<div class="modal-overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal">
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button type="button" class="btn-icon" aria-label="Close dialog">${Icons.x(18)}</button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-foot" style="display:none"></div>
      </div>
    </div>`
  );
  const body = $('.modal-body', overlay);
  const foot = $('.modal-foot', overlay);
  const closeBtn = $('.modal-head button', overlay);

  const close = (opts = {}) => {
    document.removeEventListener('keydown', onKey);
    overlay.remove();
    document.body.style.overflow = '';
    if (activeModal && activeModal.close === closeRef) activeModal = null;
    if (!opts.silent && onClose) onClose();
  };
  const closeRef = close;

  const onKey = (e) => { if (e.key === 'Escape' && dismissable) close(); };
  document.addEventListener('keydown', onKey);
  if (dismissable) {
    closeBtn.addEventListener('click', () => close());
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
  } else {
    closeBtn.style.display = 'none';
  }
  document.body.style.overflow = 'hidden';
  if (bodyBuilder) bodyBuilder(body);
  if (footerBuilder) { footerBuilder(foot); foot.style.display = 'flex'; }
  document.body.appendChild(overlay);
  activeModal = { close };
  return { close, body, foot };
}

function closeAnyModal() {
  if (activeModal) activeModal.close({ silent: true });
}

/** Confirmation dialog for destructive actions. */
function ConfirmDialog({ title, message, confirmLabel = 'Delete', busy = false, onConfirm, onCancel }) {
  const m = openModal({
    title,
    dismissable: !busy,
    onClose: onCancel,
    bodyBuilder: (body) => body.append(el(`<p style="margin:0;color:var(--text-2)">${esc(message)}</p>`)),
    footerBuilder: (foot) => {
      const cancelBtn = el(`<button type="button" class="btn btn-ghost">Cancel</button>`);
      const okBtn = el(`<button type="button" class="btn btn-danger">${esc(confirmLabel)}</button>`);
      if (busy) { cancelBtn.disabled = true; okBtn.disabled = true; }
      cancelBtn.addEventListener('click', () => m.close());
      okBtn.addEventListener('click', async () => {
        okBtn.disabled = true;
        cancelBtn.disabled = true;
        const sp = Spinner('sm', true);
        okBtn.prepend(sp);
        try { await onConfirm(); m.close({ silent: true }); }
        finally { sp.remove(); okBtn.disabled = false; cancelBtn.disabled = false; }
      });
      foot.append(cancelBtn, okBtn);
    },
  });
  return m;
}

/** Fullscreen image viewer (works with data: URLs, unlike window.open on file://). */
function openLightbox(src) {
  const overlay = el(
    `<div class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Image preview">
      <img src="${esc(src)}" alt="Post image preview">
      <button type="button" class="lightbox-close" aria-label="Close image preview">${Icons.x(20)}</button>
    </div>`
  );
  const close = () => {
    document.removeEventListener('keydown', onKey);
    overlay.remove();
    document.body.style.overflow = '';
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  $('.lightbox-close', overlay).addEventListener('click', close);
  document.body.style.overflow = 'hidden';
  document.body.appendChild(overlay);
}

/* ---------------- dropdown menus ---------------- */
function toggleMenu(anchorBtn, buildItems) {
  const wrap = anchorBtn.parentElement;
  const existing = $('.menu', wrap);
  if (existing) { existing.remove(); return null; }
  const menu = el(`<div class="menu" role="menu"></div>`);
  buildItems(menu);
  wrap.appendChild(menu);
  return menu;
}

// Close any open dropdown when clicking outside of it.
document.addEventListener('pointerdown', (e) => {
  $$('.menu').forEach((menu) => {
    if (menu.contains(e.target)) return;                       // click inside the menu -> keep
    const wrap = menu.parentElement;                           // .menu-anchor / .post-menu-wrap
    if (wrap && wrap.contains(e.target)) return;               // click on the toggle button -> toggle handles it
    menu.remove();                                             // click elsewhere -> close
  });
}, true);

/* ---------------- image picking & downscaling ---------------- */
function fileToDataURL(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\/(jpeg|png|gif|webp)$/i.test(file.type)) {
      return reject(new Error('Please choose a JPG, PNG, GIF or WebP image.'));
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('The image could not be read. Please try another file.'));
    reader.onload = () => {
      const raw = String(reader.result || '');
      const img = new Image();
      img.onerror = () => resolve(raw); // unreadable via canvas? keep raw
      img.onload = () => {
        try {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          if (scale >= 1 && raw.length < 180 * 1024) return resolve(raw); // small enough already
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (e) {
          resolve(raw);
        }
      };
      img.src = raw;
    };
    reader.readAsDataURL(file);
  });
}

/**
 * Follow / Following toggle. Hidden for the user's own profile.
 * onChange(delta, following, followersCount) lets parents sync counts.
 */
function FollowButton(target, { size = '', onChange } = {}) {
  if (target.isSelf) return el('<span></span>');
  let following = !!target.isFollowing;
  let busy = false;
  let hovering = false;

  const btn = el(
    `<button type="button" class="btn ${following ? 'btn-outline' : 'btn-primary'} ${size}" aria-pressed="${following}"></button>`
  );
  const errSpan = el(`<span class="field-error" style="font-size:11.5px;display:none"></span>`);
  const root = el(`<span style="display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px"></span>`);
  root.append(btn, errSpan);

  const paint = () => {
    const label = following ? (hovering ? 'Unfollow' : 'Following') : 'Follow';
    btn.className = `btn ${following ? 'btn-outline' : 'btn-primary'} ${size}`;
    btn.setAttribute('aria-pressed', String(following));
    btn.title = '';
    btn.style.borderColor = following && hovering ? 'var(--danger)' : '';
    btn.style.color = following && hovering ? 'var(--danger)' : '';
    btn.innerHTML = `${following ? Icons.userCheck(15) : Icons.userPlus(15)}${esc(label)}`;
  };

  btn.addEventListener('mouseenter', () => { hovering = true; paint(); });
  btn.addEventListener('mouseleave', () => { hovering = false; paint(); });
  btn.addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    errSpan.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = Spinner('sm', !following).outerHTML;
    try {
      const next = !following;
      const res = next ? api.follows.follow(state.me._id, target._id) : api.follows.unfollow(state.me._id, target._id);
      following = res.following;
      paint();
      onChange && onChange(res.following ? 1 : -1, res.following, res.followersCount);
    } catch (err) {
      errSpan.textContent = err.message;
      errSpan.style.display = 'inline';
      btn.title = err.message;
      paint();
    } finally {
      busy = false;
      btn.disabled = false;
    }
  });

  paint();
  return root;
}

/** Row card for user lists (search results, followers, following). */
function UserCard(user, onFollowChange) {

/* ---------------- comment section ---------------- */
const MAX_COMMENT_CHARS = 300;

/**
 * Comments for a post: list (oldest first), inline add form,
 * delete for own comments. Loaded when expanded.
 */
function CommentSection(post, onCountChange) {
  const me = state.me;
  let submitting = false;

  const root = el(
    `<div class="comments">
      <div class="alert-slot" style="display:none"></div>
      <div class="comments-list"><div class="center-load" style="padding:14px">${Spinner('sm').outerHTML}</div></div>
      <form class="comment-form">
        <input class="input" placeholder="Write a comment..." maxlength="${MAX_COMMENT_CHARS}" aria-label="Write a comment">
        <button class="send-btn" type="submit" aria-label="Send comment" disabled>${Icons.send(17)}</button>
      </form>
    </div>`
  );
  const listEl = $('.comments-list', root);
  const alertSlot = $('.alert-slot', root);
  const input = $('input', root);
  const sendBtn = $('.send-btn', root);

  const showError = (msg) => {
    alertSlot.innerHTML = '';
    const a = Alert('error', msg, { onDismiss: () => { alertSlot.innerHTML = ''; alertSlot.style.display = 'none'; } });
    if (a) { alertSlot.append(a); alertSlot.style.display = 'block'; }
  };

  const renderComment = (c) => {
    const row = el(
      `<div class="comment">
        <a href="#/profile/${esc(c.author.username)}" aria-label="${esc(c.author.name)}'s profile" data-avatar></a>
        <div style="flex:1;min-width:0">
          <div class="comment-bubble">
            <a href="#/profile/${esc(c.author.username)}" class="username-link" style="font-size:13.5px">${esc(c.author.name)}</a>
            <span data-text></span>
          </div>
          <div class="comment-meta">
            <span>${timeAgo(c.createdAt)}</span>
            ${c.author && c.author._id === me._id ? `<button type="button" data-del aria-label="Delete comment">${Icons.trash(13)} Delete</button>` : ''}
          </div>
        </div>
      </div>`
    );
    $('[data-text]', row).textContent = ' ' + c.text;
    $('[data-avatar]', row).append(Avatar(c.author, 'sm'));
    const del = $('[data-del]', row);
    if (del) {
      del.addEventListener('click', () => {
        try {
          api.comments.remove(c._id, me._id);
          row.remove();
          onCountChange(-1);
          if (!$('.comment', listEl)) listEl.innerHTML = '<p class="muted small" style="margin:4px 0 8px">No comments yet — start the conversation.</p>';
        } catch (err) { showError(err.message); }
      });
    }
    return row;
  };

  // initial load (brief loader mirrors the original fetch)
  (async () => {
    await delay(180);
    try {
      const { comments } = api.comments.forPost(post._id);
      listEl.innerHTML = '';
      if (comments.length === 0) {
        listEl.innerHTML = '<p class="muted small" style="margin:4px 0 8px">No comments yet — start the conversation.</p>';
      } else {
        comments.forEach((c) => listEl.append(renderComment(c)));
      }
    } catch (err) {
      listEl.innerHTML = '';
      showError(err.message);
    }
  })();

  input.addEventListener('input', () => { sendBtn.disabled = !input.value.trim() || submitting; });
  root.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = input.value.trim();
    if (!value || submitting) return;
    submitting = true;
    sendBtn.disabled = true;
    sendBtn.innerHTML = Spinner('sm', true).outerHTML;
    try {
      await delay(180);
      const { comment } = api.comments.create(post._id, me._id, value);
      const placeholder = $('p.muted', listEl);
      if (placeholder) placeholder.remove();
      listEl.append(renderComment(comment));
      input.value = '';
      onCountChange(1);
    } catch (err) {
      showError(err.message);
    } finally {
      submitting = false;
      sendBtn.innerHTML = Icons.send(17);
      sendBtn.disabled = !input.value.trim();
    }
  });

  return root;
}

/* ---------------- post card ---------------- */
/**
 * Single post card: author, content, image, like & comment actions,
 * edit/delete menu for the author, expandable comments.
 */
function PostCard(post, { onChanged, onDeleted, autoOpenComments = false } = {}) {
  const me = state.me;
  const isOwn = String(post.author?._id) === String(me._id);

  let liked = !!post.likedByMe;
  let likeCount = post.likeCount;
  let commentCount = post.commentCount;
  let commentsOpen = !!autoOpenComments;
  let commentsMounted = false;

  const root = el(
    `<article class="card post-card page-fade">
      <div class="post-header">
        <a data-avatar href="#/profile/${esc(post.author.username)}" aria-label="${esc(post.author.name)}'s profile"></a>
        <div class="who">
          <div class="name-row">
            <a class="username-link" href="#/profile/${esc(post.author.username)}">${esc(post.author.name)}</a>
            <a class="handle handle-link" href="#/profile/${esc(post.author.username)}">@${esc(post.author.username)}</a>
          </div>
          <span class="time" title="${esc(new Date(post.createdAt).toLocaleString())}">${timeAgo(post.createdAt)}</span>
        </div>
        ${isOwn ? `
        <div class="post-menu-wrap">
          <button type="button" class="btn-icon" aria-haspopup="menu" aria-expanded="false" aria-label="Post options">${Icons.more(18)}</button>
        </div>` : ''}
      </div>
      <div class="alert-slot" style="display:none"></div>
      <div class="post-content"></div>
      <div class="post-actions">
        <button type="button" class="action-btn like${liked ? ' liked' : ''}" aria-pressed="${liked}" aria-label="${liked ? 'Unlike post' : 'Like post'}">${Icons.heart(19, liked)}<span>${likeCount}</span></button>
        <button type="button" class="action-btn comment" aria-expanded="${commentsOpen}" aria-label="Toggle comments">${Icons.comment(19)}<span>${commentCount}</span></button>
      </div>
      <div class="comments-slot"></div>
    </article>`
  );

  const contentEl = $('.post-content', root);
  contentEl.textContent = post.content; // textContent keeps newlines (CSS pre-wrap) + is XSS-safe

  $('[data-avatar]', root).append(Avatar(post.author, 'md'));

  const alertSlot = $('.alert-slot', root);
  const showError = (msg) => {
    alertSlot.innerHTML = '';
    const a = Alert('error', msg, { onDismiss: () => { alertSlot.innerHTML = ''; alertSlot.style.display = 'none'; } });
    if (a) { alertSlot.append(a); alertSlot.style.display = 'block'; }
  };

  // optional image with fallback + lightbox (works on file://, unlike window.open)
  if (post.image) {
    const wrap = el(`<div class="post-image"></div>`);
    const img = el(`<img src="${esc(post.image)}" alt="Post attachment" loading="lazy">`);
    img.addEventListener('error', () => wrap.remove());
    img.addEventListener('click', () => openLightbox(post.image));
    wrap.append(img);
    contentEl.after(wrap);
  }

  /* ----- like (optimistic with rollback) ----- */
  const likeBtn = $('.action-btn.like', root);
  const likeCountEl = $('span', likeBtn);
  likeBtn.addEventListener('click', () => {
    const prev = { liked, likeCount };
    const nextLiked = !liked;
    liked = nextLiked;
    likeCount = Math.max(0, likeCount + (nextLiked ? 1 : -1));
    paintLike();
    try {
      const res = nextLiked ? api.posts.like(post._id, me._id) : api.posts.unlike(post._id, me._id);
      liked = res.liked;
      likeCount = res.likeCount;
      paintLike();
    } catch (err) {
      liked = prev.liked;
      likeCount = prev.likeCount;
      paintLike();
      showError(err.message);
    }
  });
  function paintLike() {
    likeBtn.classList.toggle('liked', liked);
    likeBtn.setAttribute('aria-pressed', String(liked));
    likeBtn.setAttribute('aria-label', liked ? 'Unlike post' : 'Like post');
    likeCountEl.textContent = String(likeCount);
    likeBtn.querySelector('svg').outerHTML = Icons.heart(19, liked);
    if (liked) { // re-trigger the heart-pop animation
      const svg = likeBtn.querySelector('svg');
      svg.style.animation = 'none';
      void svg.getBoundingClientRect();
      svg.style.animation = '';
    }
  }

  /* ----- comments ----- */
  const commentBtn = $('.action-btn.comment', root);
  const commentCountEl = $('span', commentBtn);
  const commentsSlot = $('.comments-slot', root);
  const mountComments = () => {
    if (commentsMounted) return;
    commentsMounted = true;
    commentsSlot.append(CommentSection(post, (delta) => {
      commentCount = Math.max(0, commentCount + delta);
      commentCountEl.textContent = String(commentCount);
    }));
  };
  const syncCommentsVisibility = () => {
    if (commentsSlot.firstChild) commentsSlot.firstChild.style.display = commentsOpen ? '' : 'none';
  };
  commentBtn.addEventListener('click', () => {
    commentsOpen = !commentsOpen;
    commentBtn.setAttribute('aria-expanded', String(commentsOpen));
    if (commentsOpen) mountComments();
    syncCommentsVisibility();
  });
  // Post detail opens with the conversation already visible
  if (commentsOpen) mountComments();

  /* ----- author menu: edit / delete ----- */
  const menuBtn = $('.post-menu-wrap button', root);
  if (menuBtn) {
    menuBtn.addEventListener('click', () => {
      const wasOpen = !!$('.menu', menuBtn.parentElement);
      toggleMenu(menuBtn, (menu) => {
        const editItem = el(`<button type="button" class="menu-item" role="menuitem">${Icons.edit(16)} Edit post</button>`);
        const delItem = el(`<button type="button" class="menu-item danger" role="menuitem">${Icons.trash(16)} Delete post</button>`);
        editItem.addEventListener('click', () => { menu.remove(); openEditModal(); });
        delItem.addEventListener('click', () => { menu.remove(); openDeleteConfirm(); });
        menu.append(editItem, delItem);
      });
      menuBtn.setAttribute('aria-expanded', String(!wasOpen));
    });
  }

  function openEditModal() {
    let editText = post.content;
    let saveBtnRef = null;
    const m = openModal({
      title: 'Edit post',
      onClose: () => {},
      bodyBuilder: (body) => {
        const ta = el(`<textarea class="textarea" maxlength="1000" rows="5" aria-label="Edit post content"></textarea>`);
        ta.value = post.content;
        const count = el(`<div class="char-count">${1000 - editText.length}</div>`);
        ta.addEventListener('input', () => {
          editText = ta.value;
          count.textContent = String(1000 - editText.length);
          if (saveBtnRef) saveBtnRef.disabled = !editText.trim();
        });
        body.append(ta, count);
        setTimeout(() => ta.focus(), 30);
      },
      footerBuilder: (foot) => {
        const cancelBtn = el(`<button type="button" class="btn btn-ghost">Cancel</button>`);
        const saveBtn = el(`<button type="button" class="btn btn-primary">Save changes</button>`);
        saveBtnRef = saveBtn;
        cancelBtn.addEventListener('click', () => m.close());
        saveBtn.addEventListener('click', () => {
          if (!editText.trim()) return;
          saveBtn.disabled = true;
          cancelBtn.disabled = true;
          saveBtn.prepend(Spinner('sm', true));
          try {
            const { post: updated } = api.posts.update(post._id, me._id, editText);
            post.content = updated.content;
            post.updatedAt = updated.updatedAt;
            contentEl.textContent = updated.content;
            onChanged && onChanged(updated);
            m.close({ silent: true });
          } catch (err) {
            showError(err.message);
            m.close({ silent: true });
          }
        });
        foot.append(cancelBtn, saveBtn);
      },
    });
  }

  function openDeleteConfirm() {
    let deleting = false;
    ConfirmDialog({
      title: 'Delete this post?',
      message: 'The post, its likes and its comments will be permanently removed.',
      confirmLabel: 'Delete',
      onConfirm: async () => {
        deleting = true;
        try {
          api.posts.remove(post._id, me._id);
          root.remove();
          onDeleted && onDeleted(post._id);
        } catch (err) {
          showError(err.message);
        } finally {
          deleting = false;
        }
      },
    });
  }

  return root;
}

/* ---------------- feed composer ---------------- */
const MAX_POST_CHARS = 1000;

/** Feed composer: text + optional image attachment. */
function Composer(onCreated) {
  const me = state.me;
  let image = '';
  let busy = false;

  const root = el(
    `<div class="card composer">
      <div class="alert-slot" style="display:none"></div>
      <form>
        <div class="composer-row">
          <div data-avatar></div>
          <div class="composer-main">
            <textarea class="textarea" maxlength="${MAX_POST_CHARS + 50}" rows="2" aria-label="Write a post" placeholder="${esc("What's on your mind, " + (me.name.split(' ')[0] || '') + '?')}"></textarea>
            <div class="preview-slot" style="display:none"></div>
          </div>
        </div>
        <div class="composer-footer">
          <div class="composer-tools">
            <input type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden aria-hidden="true">
            <button type="button" class="btn-icon" aria-label="Attach an image" title="Add image (max 5MB)">${Icons.image(20)}</button>
          </div>
          <div class="flex-center">
            <span class="char-count" style="margin-right:10px">${MAX_POST_CHARS}</span>
            <button class="btn btn-primary" type="submit" disabled>Post</button>
          </div>
        </div>
      </form>
    </div>`
  );

  const alertSlot = $('.alert-slot', root);
  const showError = (msg) => {
    alertSlot.innerHTML = '';
    const a = Alert('error', msg, { onDismiss: () => { alertSlot.innerHTML = ''; alertSlot.style.display = 'none'; } });
    if (a) { alertSlot.append(a); alertSlot.style.display = 'block'; }
  };
  $('[data-avatar]', root).append(Avatar(me, 'md'));

  const textarea = $('textarea', root);
  const previewSlot = $('.preview-slot', root);
  const fileInput = $('input[type=file]', root);
  const charCount = $('.char-count', root);
  const postBtn = $('button[type=submit]', root);
  const attachBtn = $('.composer-tools .btn-icon', root);

  const remaining = () => MAX_POST_CHARS - textarea.value.length;
  const repaint = () => {
    const r = remaining();
    charCount.textContent = String(r);
    charCount.classList.toggle('over', r < 0);
    postBtn.disabled = !(textarea.value.trim().length > 0 && r >= 0 && !busy);
  };
  textarea.addEventListener('input', repaint);

  const clearImage = () => {
    image = '';
    previewSlot.innerHTML = '';
    previewSlot.style.display = 'none';
    fileInput.value = '';
  };

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showError('Image is too large. Maximum size is 5MB.'); fileInput.value = ''; return; }
    try {
      image = await fileToDataURL(file, 1280, 0.78);
    } catch (err) {
      showError(err.message);
      return;
    }
    alertSlot.innerHTML = ''; alertSlot.style.display = 'none';
    previewSlot.innerHTML = '';
    const pv = el(
      `<div class="image-preview"><img alt="Selected preview"><button type="button" class="remove" aria-label="Remove image">${Icons.x(15)}</button></div>`
    );
    $('img', pv).src = image;
    $('.remove', pv).addEventListener('click', clearImage);
    previewSlot.append(pv);
    previewSlot.style.display = 'block';
  });

  root.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (textarea.value.trim().length === 0 || remaining() < 0 || busy) return;
    busy = true;
    postBtn.disabled = true;
    postBtn.innerHTML = `${Spinner('sm', true).outerHTML} Post`;
    try {
      await delay(220);
      const { post, warning } = api.posts.create(me._id, textarea.value.trim(), image);
      textarea.value = '';
      clearImage();
      repaint();
      if (warning) showError(warningMessage(post));
      onCreated(post);
    } catch (err) {
      showError(err.message);
    } finally {
      busy = false;
      postBtn.innerHTML = 'Post';
      repaint();
    }
  });

  return root;
}

function warningMessage(post) {
  return post && post.image
    ? 'Saved, but note: the image may not persist because browser storage is nearly full.'
    : 'Post created without the image — browser storage is full. Remove old posts/images to free space.';
}

async function FeedPage(pageEl, alive) {
  const listSlot = el('<div></div>');
  pageEl.append(Composer((post) => {
    const emptyMsg = $('.empty', listSlot);
    if (emptyMsg) emptyMsg.parentElement === listSlot && emptyMsg.remove();
    listSlot.prepend(PostCard(post, { onChanged: null, onDeleted: null }));
    refreshUnreadBadge();
  }));
  pageEl.append(listSlot);
  pageEl.append(el(`<p class="footer-credit">Connectify &mdash; CodeAlpha Full Stack Internship &middot; single-file demo (localStorage)</p>`));

  // skeletons + load
  const skeletons = el('<div></div>');
  skeletons.append(PostSkeleton(), PostSkeleton(), PostSkeleton());
  listSlot.append(skeletons);

  await delay(300);
  if (!alive()) return;
  listSlot.innerHTML = '';

  let page = 1;
  const first = api.posts.feed(state.me._id, page, 10);
  appendPosts(listSlot, first.posts, {
    emptyIcon: Icons.comment(26),
    emptyTitle: 'No posts yet',
    emptyText: 'Be the first to share something with the community — your post will appear right here.',
  });

  const wireLoadMore = (data) => {
    if (!data.hasMore) return;
    const wrap = el('<div class="center-load"></div>');
    const btn = el(`<button class="btn btn-outline">Load more posts</button>`);
    wrap.append(btn);
    listSlot.append(wrap);
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.prepend(Spinner('sm'));
      await delay(220);
      if (!alive()) return;
      page += 1;
      const more = api.posts.feed(state.me._id, page, 10);
      wrap.remove();
      appendPosts(listSlot, more.posts, {});
      wireLoadMore(more);
    });
  };
  wireLoadMore(first);
}

function appendPosts(listSlot, posts, { emptyIcon, emptyTitle, emptyText }) {
  if (posts.length === 0 && emptyTitle) {
    listSlot.append(EmptyState(emptyIcon, emptyTitle, esc(emptyText || '')));
    return;
  }
  posts.forEach((p) => listSlot.append(PostCard(p, {})));
}
